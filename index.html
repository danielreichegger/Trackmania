<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Trackmania Abend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase Live-Sync SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
  :root{
    --bg-1:#04060d;
    --bg-2:#070c1a;
    --surface:rgba(255,255,255,0.045);
    --surface-strong:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.09);
    --border-glow:rgba(0,229,255,0.4);
    --text:#eef4fb;
    --muted:#8a97ad;
    --accent:#00e5ff;
    --accent-2:#ff5b1f;
    --gold:#ffd166;
    --silver:#dbe2ea;
    --bronze:#ffab5e;
    --danger:#ff4d5e;
    --warn:#ffb545;
    --font-display:'Rajdhani',sans-serif;
    --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    color:var(--text);font-family:var(--font-body);min-height:100vh;padding-bottom:88px;
    background-color:var(--bg-1);
    background-image:
      radial-gradient(circle at 12% -6%, rgba(0,229,255,0.16), transparent 40%),
      radial-gradient(circle at 100% 12%, rgba(255,91,31,0.10), transparent 38%),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 64px),
      linear-gradient(180deg, var(--bg-2), var(--bg-1) 40%);
    background-attachment:fixed;
  }
  header.top{
    padding:20px 18px 16px;position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg, rgba(4,6,13,0.97), rgba(4,6,13,0.85) 70%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    overflow:hidden;
  }
  header.top::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(128deg, rgba(0,229,255,0.05) 0px, rgba(0,229,255,0.05) 2px, transparent 2px, transparent 16px),
      repeating-linear-gradient(128deg, rgba(255,91,31,0.045) 0px, rgba(255,91,31,0.045) 2px, transparent 2px, transparent 34px);
  }
  .version-badge{
    flex-shrink:0;font-family:var(--font-display);font-size:11px;font-weight:600;
    color:var(--muted);letter-spacing:0.4px;background:rgba(255,255,255,0.05);
    border:1px solid var(--border);border-radius:8px;padding:5px 9px;white-space:nowrap;
    margin-top:2px;position:relative;
  }
  .version-badge b{color:var(--accent);}
  h1{
    font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:0.5px;margin:0;
    display:flex;align-items:center;gap:9px;position:relative;
  }
  h1 .title-text{
    background:linear-gradient(100deg, var(--text) 10%, var(--accent) 40%, #fff 50%, var(--accent-2) 62%, var(--text) 90%);
    background-size:260% 100%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 14px rgba(0,229,255,0.4));
    animation:titleSheen 7s ease-in-out infinite;
  }
  @keyframes titleSheen{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  h1 .flag{font-size:19px;filter:drop-shadow(0 0 8px rgba(0,229,255,0.5));}
  main{padding:16px;max-width:560px;margin:0 auto;}
  section.view{display:none;}
  section.view.active{display:block;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .card{
    position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:17px;margin-bottom:14px;backdrop-filter:blur(16px);
    box-shadow:0 10px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg, var(--accent), transparent 65%);
    opacity:0.75;
  }
  .card h2{
    font-family:var(--font-display);font-size:17px;font-weight:600;margin:0 0 12px;
    color:var(--text);letter-spacing:0.3px;
  }
  .muted{color:var(--muted);font-size:13px;}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 10px;}

  input[type="text"], input[type="date"], input[type="number"]{
    background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:11px 12px;font-size:15px;font-family:var(--font-body);
  }
  input[type="date"]{color-scheme:dark;width:100%;}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,255,0.15);}

  .chip-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .chip{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:rgba(255,255,255,0.045);border:1px solid var(--border);border-radius:10px;
    padding:12px 15px;font-size:15px;width:100%;
    cursor:pointer;user-select:none;transition:all .15s ease;font-weight:500;
  }
  .chip::after{content:'';width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;}
  .chip.active{
    border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,0.08);
    font-weight:600;
  }
  .chip.active::after{
    background:var(--accent);border-color:var(--accent);
    box-shadow:0 0 10px rgba(0,229,255,0.6);
  }
  .add-toggle{background:none;border:none;color:var(--muted);font-size:12px;padding:6px 2px;cursor:pointer;text-decoration:underline;}
  .add-row{display:flex;gap:8px;margin-top:8px;}
  .add-row input{flex:1;}

  button{
    font-family:var(--font-body);font-weight:600;font-size:14px;border-radius:9px;border:1px solid var(--border);
    background:rgba(255,255,255,0.05);color:var(--text);padding:11px 16px;cursor:pointer;transition:transform .1s ease;
  }
  button:active{transform:scale(0.97);}
  button.danger{color:var(--danger);border-color:rgba(255,77,94,0.5);background:rgba(255,77,94,0.08);}
  button.primary{
    position:relative;overflow:hidden;
    background:linear-gradient(135deg, var(--accent), #6df3ff);
    border-color:var(--accent);color:#04222a;font-weight:700;letter-spacing:0.2px;
    box-shadow:0 0 22px rgba(0,229,255,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  button.primary::after{
    content:'';position:absolute;top:0;left:-75%;width:50%;height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.55), transparent);
    transform:skewX(-18deg);transition:left .5s ease;
  }
  button.primary:active{box-shadow:0 0 30px rgba(0,229,255,0.6), inset 0 1px 0 rgba(255,255,255,0.4);}
  button.primary:active::after{left:130%;}
  button.primary:disabled{
    background:rgba(255,255,255,0.06);color:var(--muted);border-color:var(--border);
    box-shadow:none;font-weight:600;
  }
  button.primary:disabled::after{display:none;}

  .match-item{padding:10px 0;border-top:1px solid var(--border);}
  .match-item:first-child{border-top:none;}
  .match-date{font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:0.3px;}
  .match-standing{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;}
  .match-standing span{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:7px;padding:3px 9px;}
  .match-standing span.win{color:var(--gold);border-color:var(--gold);background:rgba(255,209,102,0.1);box-shadow:0 0 10px rgba(255,209,102,0.25);}

  .session-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;}
  .session-head .info{font-size:13px;color:var(--muted);}
  .session-head .info b{color:var(--accent);text-shadow:0 0 10px rgba(0,229,255,0.4);}

  .table-wrap{overflow-x:auto;margin:0 -17px;padding:0 17px;-webkit-overflow-scrolling:touch;}
  table.grid{border-collapse:collapse;font-size:13px;}
  table.grid th{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--muted);
    padding:6px 4px;text-align:center;white-space:nowrap;letter-spacing:0.4px;}
  table.grid td{padding:4px;text-align:center;}
  table.grid .namecol{position:sticky;left:0;background:#0b1020;z-index:2;text-align:left;
    padding:6px 10px 6px 0;font-size:14px;font-weight:500;white-space:nowrap;}
  table.grid th.namecol{background:transparent;}
  table.grid .sumcol{font-family:var(--font-display);font-weight:700;color:var(--accent);font-size:16px;
    padding:6px 4px 6px 10px;white-space:nowrap;text-shadow:0 0 12px rgba(0,229,255,0.5);}
  .cell-input{
    width:44px;text-align:center;padding:9px 2px;font-family:var(--font-display);font-size:15px;
    border-radius:8px;background:rgba(255,255,255,0.04);
  }
  .cell-input.dnf{color:var(--danger);border-color:var(--danger);background:rgba(255,77,94,0.08);}
  .cell-input.dup{border-color:var(--warn);box-shadow:0 0 8px rgba(255,181,69,0.4);}
  .track-time-input.time-invalid{border-color:var(--danger);box-shadow:0 0 8px rgba(255,77,94,0.4);background:rgba(255,77,94,0.08);}
  .cell-input.star{color:var(--gold);border-color:var(--gold);background:rgba(255,209,102,0.1);box-shadow:0 0 8px rgba(255,209,102,0.35);}
  .ro-cell{display:inline-block;min-width:28px;padding:6px 4px;font-family:var(--font-display);font-size:14px;border-radius:6px;}
  .ro-cell.dnf{color:var(--danger);}
  .ro-cell.star{color:var(--gold);}
  th.track-th{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--muted);}
  th.track-th:active{color:var(--accent);}
  .warn-note{color:var(--warn);font-size:12px;margin-top:8px;}

  .standing-list{margin-top:4px;}
  .result-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);}
  .result-row:first-child{border-top:none;}
  .rank-badge{
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:13px;background:rgba(255,255,255,0.05);
    border:1px solid var(--border);color:var(--muted);flex-shrink:0;
  }
  .rank-badge.p1{background:rgba(255,209,102,0.15);border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(255,209,102,0.5);}
  .rank-badge.p2{background:rgba(219,226,234,0.12);border-color:var(--silver);color:var(--silver);box-shadow:0 0 10px rgba(219,226,234,0.3);}
  .rank-badge.p3{background:rgba(255,171,94,0.14);border-color:var(--bronze);color:var(--bronze);box-shadow:0 0 10px rgba(255,171,94,0.35);}
  .result-row .name{flex:1;font-size:14px;}
  .result-row .pts{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--accent);text-shadow:0 0 10px rgba(0,229,255,0.4);}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat-box{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;
    backdrop-filter:blur(14px);
  }
  .stat-box .num{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent);
    text-shadow:0 0 14px rgba(0,229,255,0.5);}
  .stat-box .lbl{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:0.3px;}

  table.stats{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.stats th{text-align:center;color:var(--muted);font-weight:600;font-size:10.5px;padding:0 3px 8px;letter-spacing:0.3px;}
  table.stats th:first-child{text-align:left;}
  table.stats td{padding:9px 3px;border-top:1px solid var(--border);text-align:center;}
  table.stats td:first-child{text-align:left;font-weight:500;}

  nav.bottom{
    position:fixed;bottom:0;left:0;right:0;display:flex;
    background:rgba(7,12,26,0.85);backdrop-filter:blur(18px);
    border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:20;
  }
  nav.bottom button{
    flex:1;background:none;border:none;border-radius:0;padding:12px 4px 10px;
    color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;
    position:relative;font-weight:600;letter-spacing:0.3px;
  }
  nav.bottom button .ico{font-size:19px;}
  nav.bottom button.active{color:var(--accent);text-shadow:0 0 10px rgba(0,229,255,0.5);}
  nav.bottom button.active::after{
    content:'';position:absolute;top:0;left:30%;right:30%;height:2px;
    background:var(--accent);box-shadow:0 0 8px rgba(0,229,255,0.8);border-radius:2px;
  }

  .toast{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(10,15,28,0.9);
    border:1px solid var(--accent);color:var(--text);padding:9px 16px;border-radius:20px;font-size:13px;
    z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:0 0 20px rgba(0,229,255,0.35);
    backdrop-filter:blur(10px);
    max-width:88vw;text-align:center;white-space:normal;line-height:1.4;
  }
  .toast.show{opacity:1;}
  .section-actions{display:flex;gap:8px;margin-top:14px;}
  .confirm-overlay{
    position:fixed;inset:0;background:rgba(4,6,13,0.75);backdrop-filter:blur(4px);
    z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .confirm-box{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:20px;max-width:320px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .confirm-box p{margin:0 0 16px;font-size:14px;line-height:1.4;color:var(--text);}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions button{flex:1;}
</style>
</head>
<body>

<header class="top">
  <h1><span class="flag">🏁</span><span class="title-text">Trackmania</span></h1>
  <div class="version-badge" id="versionBadge"></div>
</header>

<main>

  <section class="view active" id="view-rennen">
    <div class="card" id="dateCard">
      <h2>Datum</h2>
      <input type="date" id="dateInput" />
    </div>

    <div class="card" id="driversCard">
      <h2>Fahrer</h2>
      <div class="chip-grid" id="chipGrid"></div>
      <button class="add-toggle" id="addToggleBtn">+ weiteren Fahrer</button>
      <div class="add-row" id="addRow" style="display:none;">
        <input type="text" id="newNameInput" placeholder="Name" maxlength="18" />
        <button id="addNameBtn">+</button>
      </div>
    </div>

    <div id="raceArea"><div class="empty">Verbinde mit Firebase Live-Datenbank …</div></div>
  </section>

  <section class="view" id="view-archiv">
    <div id="archivContent"></div>
  </section>

  <section class="view" id="view-strecken">
    <div id="streckenContent"></div>
  </section>

  <section class="view" id="view-statistik">
    <div id="statistikContent"></div>
  </section>

  <section class="view" id="view-sicherung">
    <div id="sicherungContent"></div>
  </section>

</main>

<nav class="bottom">
  <button data-view="rennen" class="active"><span class="ico">🏎️</span>Rennen</button>
  <button data-view="archiv"><span class="ico">🗂️️</span>Archiv</button>
  <button data-view="strecken"><span class="ico">🏁</span>Strecken</button>
  <button data-view="statistik"><span class="ico">🏆</span>Statistik</button>
  <button data-view="sicherung"><span class="ico">💾</span>Sicherung</button>
</nav>

<div class="toast" id="toast"></div>

<script>
// ==================== FIREBASE KONFIGURATION ====================
const firebaseConfig = {
  databaseURL: "https://trkmn-44c02-default-rtdb.europe-west1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);
const dbRef = firebase.database().ref('tm_scoreboard_state');

// ==================== KONSTANTEN ====================
const FIXED_DRIVERS = ['Max','Andy','Dani','Olly','Bär','Mky'];
const APP_VERSION = 12;
const APP_VERSION_DATE = '2026-10-02';
const VERSION_HISTORY = [
  { v:12, date:'2026-10-02', notes:'Echtzeit-Synchronisation via Firebase. Alle Änderungen werden sofort live auf allen Geräten gespiegelt.' }

function todayStr(){ return new Date().toISOString().slice(0,10); }

function defaultState(){
  return {
    savedNames: [...FIXED_DRIVERS],
    selectedNames: [...FIXED_DRIVERS],
    selectedDate: todayStr(),
    sessions: [],
    liveDraft: null,
    lastExportDate: null,
    backupHistory: []
  };
}

function importSeedHistoryOnce(state){
  const existingIds = new Set(state.sessions.map(s=>s.id));
  let addedAny = false;
  SEED_HISTORY.forEach(seed=>{
    if(!existingIds.has(seed.id)){
      state.sessions.push(JSON.parse(JSON.stringify(seed)));
      addedAny = true;
    }
  });
  return addedAny;
}

function showToast(msg, durationMs){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), durationMs || 1800);
}

function showConfirm(message, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `<div class="confirm-box">
    <p>${escapeHtml(message)}</p>
    <div class="confirm-actions">
      <button id="confirmCancelBtn">Abbrechen</button>
      <button class="danger" id="confirmOkBtn">Bestätigen</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target === overlay) close(); });
  document.getElementById('confirmCancelBtn').onclick = close;
  document.getElementById('confirmOkBtn').onclick = ()=>{ close(); onConfirm(); };
}

      state = val;
      if(!state.sessions) state.sessions = [];
      if(!state.savedNames) state.savedNames = [...FIXED_DRIVERS];
      if(!state.selectedNames) state.selectedNames = [...FIXED_DRIVERS];
      importSeedHistoryOnce(state);
    }
    syncDraftFromState();
    render();
  });
}

function syncDraftFromState(){
  draft = state.liveDraft || null;
  rennenPhase = draft ? 'editing' : 'idle';
}

function saveState(){
  if(state){
    dbRef.set(state);
  }
}

function saveDraft(){
  state.liveDraft = draft;
  saveState();
}

function clearDraft(){
  draft = null;
  rennenPhase = 'idle';
  state.liveDraft = null;
  saveState();
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function sameSet(a,b){
  if(a.length!==b.length) return false;
  const sa=[...a].sort(), sb=[...b].sort();
  return sa.every((v,i)=>v===sb[i]);
}

function orderedSavedNames(){
  const canonicalOrder = ['Max','Andy','Dani','Olly','Bär','Mky'];
  const known = canonicalOrder.filter(n=>state.savedNames.includes(n));
  const extra = state.savedNames.filter(n=>!canonicalOrder.includes(n));
  return [...known, ...extra];
}

function formatDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'});
}

function cssEscape(s){ return s.replace(/(["\\])/g,'\\$1'); }

function switchView(v){
  currentView = v;
  document.querySelectorAll('section.view').forEach(s=>s.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  renderCurrentView();
}

function renderCurrentView(){
  if(!state) return;
  if(currentView==='rennen') renderRennen();
  else if(currentView==='archiv') renderArchiv();
  else if(currentView==='strecken') renderStrecken();
  else if(currentView==='statistik') renderStatistik();
  else if(currentView==='sicherung') renderSicherung();
}

function render(){
  if(!state) return;
  document.getElementById('dateInput').value = state.selectedDate || todayStr();
  renderCurrentView();
}

/* ---------------- RENNEN ---------------- */
function renderRennen(){
  const dateCard = document.getElementById('dateCard');
  const driversCard = document.getElementById('driversCard');
  const area = document.getElementById('raceArea');

  if(rennenPhase === 'editing' && draft){
    dateCard.style.display = 'none';
    driversCard.style.display = 'none';
    renderEditingPhase(area);
    return;
  }

  dateCard.style.display = 'block';
  driversCard.style.display = 'block';
  const grid = document.getElementById('chipGrid');
  grid.innerHTML = '';
  orderedSavedNames().forEach(name=>{
    const active = state.selectedNames.includes(name);
    const chip = document.createElement('div');
    chip.className = 'chip' + (active?' active':'');
    chip.textContent = name;
    chip.onclick = ()=>toggleSelected(name);
    grid.appendChild(chip);
  });

  if(rennenPhase === 'idle'){
    area.innerHTML = `<div class="card" style="text-align:center;">
      <button class="primary full" id="startNewRaceBtn">Neues Rennen starten</button>
    </div>`;
    document.getElementById('startNewRaceBtn').onclick = ()=>{
      rennenPhase = 'setup';
      renderRennen();
    };
    return;
  }

  const n = state.selectedNames.length;
  area.innerHTML = `<div class="card">
    <p class="muted" style="margin:0 0 12px;">${n<2 ? 'Wähle mindestens 2 Fahrer aus.' : `${n} Fahrer ausgewählt.`}</p>
    <button class="primary full" id="continueSetupBtn" ${n<2?'disabled':''}>Weiter</button>
  </div>`;
  document.getElementById('continueSetupBtn').onclick = ()=>continueToEditing();
}

function toggleSelected(name){
  const i = state.selectedNames.indexOf(name);
  if(i>=0) state.selectedNames.splice(i,1); else state.selectedNames.push(name);
  saveState(); renderRennen();
}

function continueToEditing(){
  if(state.selectedNames.length < 2) return;
  const order = [...state.selectedNames];
  const g = {};
  const penalties = {};
  const trackNames = new Array(order.length+1).fill('');
  const trackTimes = {};
  order.forEach(n=>{
    g[n] = new Array(order.length+1).fill(null);
    penalties[n] = 0;
    trackTimes[n] = new Array(order.length+1).fill(null);
  });

  draft = { id: null, date: state.selectedDate, participants: order, grid: g, penalties, trackNames, trackTimes, note: '' };
  rennenPhase = 'editing';
  saveDraft();
  renderRennen();
}

function renderEditingPhase(area){
  const N = draft.participants.length;
  const rounds = draft.grid[draft.participants[0]].length;

  let html = `<div class="card">
    <div class="session-head">
      <div class="info"><b>${formatDate(draft.date)}</b> · ${N} Fahrer · ${rounds} Tracks</div>
      <button class="danger" id="discardDraftBtn">Verwerfen</button>
    </div>
    <div class="table-wrap"><table class="grid">
      <thead><tr><th class="namecol">Fahrer</th>`;
  for(let r=1;r<=rounds;r++){
    const tname = (draft.trackNames && draft.trackNames[r-1]) ? draft.trackNames[r-1] : '';
    const label = tname ? escapeHtml(tname.length > 6 ? tname.slice(0,6)+'…' : tname) : `T${r}`;
    html += `<th class="track-th" data-track-round="${r-1}">${label}</th>`;
  }
  html += `<th>Straf.</th><th class="sumcol">Σ</th></tr></thead><tbody>`;

  draft.participants.forEach(name=>{
    html += `<tr><td class="namecol">${escapeHtml(name)}</td>`;
    const arr = draft.grid[name];
    for(let r=0;r<rounds;r++){
      const val = arr[r];
      const displayVal = val===null||val===undefined ? '' : val;
      html += `<td><input class="cell-input" type="text" data-name="${escapeHtml(name)}" data-round="${r}" value="${escapeHtml(String(displayVal))}" /></td>`;
    }
    const penaltyVal = (draft.penalties && draft.penalties[name]) || 0;
    html += `<td><input class="cell-input penalty-input" type="text" data-penalty-name="${escapeHtml(name)}" value="${penaltyVal ? escapeHtml(String(penaltyVal)) : ''}" placeholder="0" /></td>`;
    html += `<td class="sumcol" data-sumfor="${escapeHtml(name)}">–</td></tr>`;
  });
  html += `</tbody></table></div>
    <div class="section-actions">
      <button id="addExtraRoundBtn">+ Zusatztrack</button>
    </div>
  </div>`;

  html += `<div class="card">
    <h2>Zwischenstand</h2>
    <div class="standing-list" id="standingList"></div>
  </div>`;

  html += `<div class="section-actions">
    <button class="primary full" id="saveDraftBtn">Zwischenstand Speichern</button>
  </div>
  <div class="section-actions">
    <button class="full" id="finishRaceBtn">Fertigstellen (Ins Archiv)</button>
  </div>`;

  area.innerHTML = html;

  area.querySelectorAll('.cell-input[data-name]').forEach(input=>{
    input.addEventListener('change', ()=>onDraftCellChange(input));
  });
  
  document.getElementById('discardDraftBtn').onclick = ()=>{
    showConfirm('Rennen verwerfen?', ()=>{ clearDraft(); renderRennen(); });
  };

  document.getElementById('saveDraftBtn').onclick = ()=>{
    saveDraft();
    showToast('In Firebase gespeichert!');
  };
  
  document.getElementById('addExtraRoundBtn').onclick = ()=>{
    draft.participants.forEach(name=> draft.grid[name].push(null));
    saveDraft();
    renderRennen();
  };
  
  document.getElementById('finishRaceBtn').onclick = ()=>{
    commitDraftToArchive();
    clearDraft();
    showToast('Rennen im Archiv gespeichert!');
    renderRennen();
  };

  updateSumsAndStandings(draft);
}

function onDraftCellChange(input){
  const name = input.dataset.name;
  const round = parseInt(input.dataset.round, 10);
  const val = input.value.trim() === '' ? null : (isNaN(input.value) ? input.value : parseInt(input.value, 10));
  draft.grid[name][round] = val;
  saveDraft();
}

function commitDraftToArchive(){
  const copy = JSON.parse(JSON.stringify(draft));
  copy.id = 's' + Date.now();
  state.sessions.push(copy);
  saveState();
}

function sessionTotals(session){
  const totals = {};
  session.participants.forEach(p=>totals[p]=0);
  const N = session.participants.length;
  session.participants.forEach(name=>{
    const arr = session.grid[name] || [];
    arr.forEach(val=>{
      if(val===null || val===undefined || val==='') return;
      if(val==='DNF'){ totals[name] += N+1; return; }
      const n = parseInt(val, 10);
      if(!isNaN(n)) totals[name] += n;
    });
  });
  return totals;
}

function updateSumsAndStandings(session){
  const totals = sessionTotals(session);
  session.participants.forEach(name=>{
    const cell = document.querySelector(`[data-sumfor="${cssEscape(name)}"]`);
    if(cell) cell.textContent = totals[name];
  });

  const sorted = Object.entries(totals).sort((a,b)=>a[1]-b[1]);
  const list = document.getElementById('standingList');
  if(list){
    list.innerHTML = sorted.map(([name,pts],i)=>`
      <div class="result-row">
        <div class="rank-badge">${i+1}</div>
        <div class="name">${escapeHtml(name)}</div>
        <div class="pts">${pts}</div>
      </div>`).join('');
  }
}

/* ---------------- ARCHIV ---------------- */
function renderArchiv(){
  const el = document.getElementById('archivContent');
  if(!state.sessions || state.sessions.length === 0){
    el.innerHTML = '<div class="empty">Noch keine Rennen gespeichert.</div>';
    return;
  }
  const sorted = state.sessions.slice().reverse();
  el.innerHTML = sorted.map(s=>`
    <div class="card">
      <div class="session-head">
        <div class="info"><b>${formatDate(s.date)}</b> · ${s.participants.length} Fahrer</div>
      </div>
      <div class="match-standing">${s.participants.map(p=>`<span>${escapeHtml(p)}</span>`).join('')}</div>
    </div>`).join('');
}

function renderStrecken(){
  document.getElementById('streckenContent').innerHTML = '<div class="empty">Streckenansicht aktiv</div>';
}

function renderStatistik(){
  document.getElementById('statistikContent').innerHTML = '<div class="empty">Statistik-Ansicht aktiv</div>';
}

function renderSicherung(){
  const el = document.getElementById('sicherungContent');
  const url = window.location.href;
  el.innerHTML = `<div class="card">
    <h2>Link Teilen</h2>
    <input type="text" readonly value="${escapeHtml(url)}" style="width:100%;margin-bottom:10px;" />
    <p class="muted">Status: Live-Verbindung zu Firebase aktiv!</p>
  </div>`;
}

/* ---------------- INITIALISIERUNG ---------------- */
document.querySelectorAll('nav.bottom button').forEach(btn=>{ 
  btn.onclick = ()=>switchView(btn.dataset.view); 
});

document.getElementById('versionBadge').innerHTML = `<b>V${APP_VERSION}</b>`;

initRealtimeDatabase();
</script>
</body>
</html>
