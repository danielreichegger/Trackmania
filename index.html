<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Trackmania Abend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase Live-Sync SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
  :root{
    --bg-1:#04060d;
    --bg-2:#070c1a;
    --surface:rgba(255,255,255,0.045);
    --surface-strong:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.09);
    --border-glow:rgba(0,229,255,0.4);
    --text:#eef4fb;
    --muted:#8a97ad;
    --accent:#00e5ff;
    --accent-2:#ff5b1f;
    --gold:#ffd166;
    --silver:#dbe2ea;
    --bronze:#ffab5e;
    --danger:#ff4d5e;
    --warn:#ffb545;
    --font-display:'Rajdhani',sans-serif;
    --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    color:var(--text);font-family:var(--font-body);min-height:100vh;padding-bottom:88px;
    background-color:var(--bg-1);
    background-image:
      radial-gradient(circle at 12% -6%, rgba(0,229,255,0.16), transparent 40%),
      radial-gradient(circle at 100% 12%, rgba(255,91,31,0.10), transparent 38%),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 64px),
      linear-gradient(180deg, var(--bg-2), var(--bg-1) 40%);
    background-attachment:fixed;
  }
  header.top{
    padding:20px 18px 16px;position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg, rgba(4,6,13,0.97), rgba(4,6,13,0.85) 70%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    position:sticky;overflow:hidden;
  }
  header.top::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(128deg, rgba(0,229,255,0.05) 0px, rgba(0,229,255,0.05) 2px, transparent 2px, transparent 16px),
      repeating-linear-gradient(128deg, rgba(255,91,31,0.045) 0px, rgba(255,91,31,0.045) 2px, transparent 2px, transparent 34px);
  }
  .version-badge{
    flex-shrink:0;font-family:var(--font-display);font-size:11px;font-weight:600;
    color:var(--muted);letter-spacing:0.4px;background:rgba(255,255,255,0.05);
    border:1px solid var(--border);border-radius:8px;padding:5px 9px;white-space:nowrap;
    margin-top:2px;position:relative;
  }
  .version-badge b{color:var(--accent);}
  h1{
    font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:0.5px;margin:0;
    display:flex;align-items:center;gap:9px;position:relative;
  }
  h1 .title-text{
    background:linear-gradient(100deg, var(--text) 10%, var(--accent) 40%, #fff 50%, var(--accent-2) 62%, var(--text) 90%);
    background-size:260% 100%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 14px rgba(0,229,255,0.4));
    animation:titleSheen 7s ease-in-out infinite;
  }
  @keyframes titleSheen{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  h1 .flag{font-size:19px;filter:drop-shadow(0 0 8px rgba(0,229,255,0.5));}
  main{padding:16px;max-width:560px;margin:0 auto;}
  section.view{display:none;}
  section.view.active{display:block;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .card{
    position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:17px;margin-bottom:14px;backdrop-filter:blur(16px);
    box-shadow:0 10px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg, var(--accent), transparent 65%);
    opacity:0.75;
  }
  .card h2{
    font-family:var(--font-display);font-size:17px;font-weight:600;margin:0 0 12px;
    color:var(--text);letter-spacing:0.3px;
  }
  .muted{color:var(--muted);font-size:13px;}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 10px;}

  input[type="text"], input[type="date"], input[type="number"]{
    background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:11px 12px;font-size:15px;font-family:var(--font-body);
  }
  input[type="date"]{color-scheme:dark;width:100%;}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,255,0.15);}

  .chip-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .chip{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:rgba(255,255,255,0.045);border:1px solid var(--border);border-radius:10px;
    padding:12px 15px;font-size:15px;width:100%;
    cursor:pointer;user-select:none;transition:all .15s ease;font-weight:500;
  }
  .chip::after{content:'';width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;}
  .chip.active{
    border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,0.08);
    font-weight:600;
  }
  .chip.active::after{
    background:var(--accent);border-color:var(--accent);
    box-shadow:0 0 10px rgba(0,229,255,0.6);
  }
  .add-toggle{background:none;border:none;color:var(--muted);font-size:12px;padding:6px 2px;cursor:pointer;text-decoration:underline;}
  .add-row{display:flex;gap:8px;margin-top:8px;}
  .add-row input{flex:1;}

  button{
    font-family:var(--font-body);font-weight:600;font-size:14px;border-radius:9px;border:1px solid var(--border);
    background:rgba(255,255,255,0.05);color:var(--text);padding:11px 16px;cursor:pointer;transition:transform .1s ease;
  }
  button:active{transform:scale(0.97);}
  button.danger{color:var(--danger);border-color:rgba(255,77,94,0.5);background:rgba(255,77,94,0.08);}
  button.primary{
    position:relative;overflow:hidden;
    background:linear-gradient(135deg, var(--accent), #6df3ff);
    border-color:var(--accent);color:#04222a;font-weight:700;letter-spacing:0.2px;
    box-shadow:0 0 22px rgba(0,229,255,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  button.primary::after{
    content:'';position:absolute;top:0;left:-75%;width:50%;height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.55), transparent);
    transform:skewX(-18deg);transition:left .5s ease;
  }
  button.primary:active{box-shadow:0 0 30px rgba(0,229,255,0.6), inset 0 1px 0 rgba(255,255,255,0.4);}
  button.primary:active::after{left:130%;}
  button.primary:disabled{
    background:rgba(255,255,255,0.06);color:var(--muted);border-color:var(--border);
    box-shadow:none;font-weight:600;
  }
  button.primary:disabled::after{display:none;}

  .match-item{padding:10px 0;border-top:1px solid var(--border);}
  .match-item:first-child{border-top:none;}
  .match-date{font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:0.3px;}
  .match-standing{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;}
  .match-standing span{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:7px;padding:3px 9px;}
  .match-standing span.win{color:var(--gold);border-color:var(--gold);background:rgba(255,209,102,0.1);box-shadow:0 0 10px rgba(255,209,102,0.25);}

  .session-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;}
  .session-head .info{font-size:13px;color:var(--muted);}
  .session-head .info b{color:var(--accent);text-shadow:0 0 10px rgba(0,229,255,0.4);}

  .table-wrap{overflow-x:auto;margin:0 -17px;padding:0 17px;-webkit-overflow-scrolling:touch;}
  table.grid{border-collapse:collapse;font-size:13px;}
  table.grid th{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--muted);
    padding:6px 4px;text-align:center;white-space:nowrap;letter-spacing:0.4px;}
  table.grid td{padding:4px;text-align:center;}
  table.grid .namecol{position:sticky;left:0;background:#0b1020;z-index:2;text-align:left;
    padding:6px 10px 6px 0;font-size:14px;font-weight:500;white-space:nowrap;}
  table.grid th.namecol{background:transparent;}
  table.grid .sumcol{font-family:var(--font-display);font-weight:700;color:var(--accent);font-size:16px;
    padding:6px 4px 6px 10px;white-space:nowrap;text-shadow:0 0 12px rgba(0,229,255,0.5);}
  .cell-input{
    width:44px;text-align:center;padding:9px 2px;font-family:var(--font-display);font-size:15px;
    border-radius:8px;background:rgba(255,255,255,0.04);
  }
  .cell-input.dnf{color:var(--danger);border-color:var(--danger);background:rgba(255,77,94,0.08);}
  .cell-input.dup{border-color:var(--warn);box-shadow:0 0 8px rgba(255,181,69,0.4);}
  .track-time-input.time-invalid{border-color:var(--danger);box-shadow:0 0 8px rgba(255,77,94,0.4);background:rgba(255,77,94,0.08);}
  .cell-input.star{color:var(--gold);border-color:var(--gold);background:rgba(255,209,102,0.1);box-shadow:0 0 8px rgba(255,209,102,0.35);}
  .ro-cell{display:inline-block;min-width:28px;padding:6px 4px;font-family:var(--font-display);font-size:14px;border-radius:6px;}
  .ro-cell.dnf{color:var(--danger);}
  .ro-cell.star{color:var(--gold);}
  th.track-th{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--muted);}
  th.track-th:active{color:var(--accent);}
  .warn-note{color:var(--warn);font-size:12px;margin-top:8px;}

  .standing-list{margin-top:4px;}
  .result-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);}
  .result-row:first-child{border-top:none;}
  .rank-badge{
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:13px;background:rgba(255,255,255,0.05);
    border:1px solid var(--border);color:var(--muted);flex-shrink:0;
  }
  .rank-badge.p1{background:rgba(255,209,102,0.15);border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(255,209,102,0.5);}
  .rank-badge.p2{background:rgba(219,226,234,0.12);border-color:var(--silver);color:var(--silver);box-shadow:0 0 10px rgba(219,226,234,0.3);}
  .rank-badge.p3{background:rgba(255,171,94,0.14);border-color:var(--bronze);color:var(--bronze);box-shadow:0 0 10px rgba(255,171,94,0.35);}
  .result-row .name{flex:1;font-size:14px;}
  .result-row .pts{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--accent);text-shadow:0 0 10px rgba(0,229,255,0.4);}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat-box{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;
    backdrop-filter:blur(14px);
  }
  .stat-box .num{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent);
    text-shadow:0 0 14px rgba(0,229,255,0.5);}
  .stat-box .lbl{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:0.3px;}
  .stat-box.wide{grid-column:1 / -1;}
  .stat-box.wide .num{font-size:16px;text-shadow:none;color:var(--text);}

  table.stats{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.stats th{text-align:center;color:var(--muted);font-weight:600;font-size:10.5px;padding:0 3px 8px;letter-spacing:0.3px;}
  table.stats th:first-child{text-align:left;}
  table.stats td{padding:9px 3px;border-top:1px solid var(--border);text-align:center;}
  table.stats td:first-child{text-align:left;font-weight:500;}

  nav.bottom{
    position:fixed;bottom:0;left:0;right:0;display:flex;
    background:rgba(7,12,26,0.85);backdrop-filter:blur(18px);
    border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:20;
  }
  nav.bottom button{
    flex:1;background:none;border:none;border-radius:0;padding:12px 4px 10px;
    color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;
    position:relative;font-weight:600;letter-spacing:0.3px;
  }
  nav.bottom button .ico{font-size:19px;}
  nav.bottom button.active{color:var(--accent);text-shadow:0 0 10px rgba(0,229,255,0.5);}
  nav.bottom button.active::after{
    content:'';position:absolute;top:0;left:30%;right:30%;height:2px;
    background:var(--accent);box-shadow:0 0 8px rgba(0,229,255,0.8);border-radius:2px;
  }

  .toast{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(10,15,28,0.9);
    border:1px solid var(--accent);color:var(--text);padding:9px 16px;border-radius:20px;font-size:13px;
    z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:0 0 20px rgba(0,229,255,0.35);
    backdrop-filter:blur(10px);
    max-width:88vw;text-align:center;white-space:normal;line-height:1.4;
  }
  .toast.show{opacity:1;}
  .storage-banner{
    background:rgba(255,181,69,0.1);border-bottom:1px solid var(--warn);color:var(--warn);
    font-size:12.5px;padding:10px 18px;text-align:center;
  }
  .section-actions{display:flex;gap:8px;margin-top:14px;}
  .confirm-overlay{
    position:fixed;inset:0;background:rgba(4,6,13,0.75);backdrop-filter:blur(4px);
    z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .confirm-box{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:20px;max-width:320px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .confirm-box p{margin:0 0 16px;font-size:14px;line-height:1.4;color:var(--text);}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions button{flex:1;}
</style>
</head>
<body>

<header class="top">
  <h1><span class="flag">🏁</span><span class="title-text">Trackmania</span></h1>
  <div class="version-badge" id="versionBadge"></div>
</header>

<main>

  <div class="storage-banner" id="storageBanner" style="display:none;"></div>

  <section class="view active" id="view-rennen">
    <div class="card" id="dateCard">
      <h2>Datum</h2>
      <input type="date" id="dateInput" />
    </div>

    <div class="card" id="driversCard">
      <h2>Fahrer</h2>
      <div class="chip-grid" id="chipGrid"></div>
      <button class="add-toggle" id="addToggleBtn">+ weiteren Fahrer</button>
      <div class="add-row" id="addRow" style="display:none;">
        <input type="text" id="newNameInput" placeholder="Name" maxlength="18" />
        <button id="addNameBtn">+</button>
      </div>
    </div>

    <div id="raceArea"><div class="empty">Verbinde …</div></div>
  </section>

  <section class="view" id="view-archiv">
    <div id="archivContent"></div>
  </section>

  <section class="view" id="view-strecken">
    <div id="streckenContent"></div>
  </section>

  <section class="view" id="view-statistik">
    <div id="statistikContent"></div>
  </section>

  <section class="view" id="view-sicherung">
    <div id="sicherungContent"></div>
  </section>

</main>

<nav class="bottom">
  <button data-view="rennen" class="active"><span class="ico">🏎️</span>Rennen</button>
  <button data-view="archiv"><span class="ico">🗂️</span>Archiv</button>
  <button data-view="strecken"><span class="ico">🏁</span>Strecken</button>
  <button data-view="statistik"><span class="ico">🏆</span>Statistik</button>
  <button data-view="sicherung"><span class="ico">💾</span>Sicherung</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const FIXED_DRIVERS = ['Max','Andy','Dani','Olly','Bär','Mky'];
const APP_VERSION = 12;
const APP_VERSION_DATE = '2026-10-02';
const VERSION_HISTORY = [
  { v:1, date:'2026-09-10', notes:'Kompletter Funktionsstand: Rennen-Tabelle, Archiv, Statistik, Strafpunkte, Zeitraum-Filter, faires Gesamtranking.' },
  { v:2, date:'2026-09-10', notes:'Datum startet immer auf heute. Punktetabelle jetzt live für alle sichtbar, schon während der Eingabe (nicht erst nach Speichern).' },
  { v:3, date:'2026-09-24', notes:'Archiv zeigt beim Antippen die volle Punkteverteilung. Streckennamen & Bestzeiten pro Track eintragbar, neuer "Strecken"-Tab dafür. Stern (*) für "letzter Tropfen Benzin"-Rettung auf Platz 1, wird in der Statistik gezählt. Dieser Versionsverlauf.' },
  { v:4, date:'2026-09-24', notes:'Neu im Archiv: Sicherung exportieren (Datei-Download) und importieren (fehlende Renn-Einträge werden ergänzt, bestehende bleiben unverändert) – als Schutz gegen Datenverlust.' },
  { v:5, date:'2026-09-24', notes:'Bug behoben: Bestzeiten im "Strecken"-Tab wurden bei bestimmten Zeitformaten (z.B. "0:47" ohne Millisekunden) falsch berechnet oder gar nicht angezeigt. Zeit-Erkennung deutlich toleranter gemacht (Komma/Punkt, mit/ohne Minuten). Gleich benannte Strecken werden jetzt unabhängig von Groß-/Kleinschreibung zusammengefasst.' },
  { v:6, date:'2026-09-24', notes:'Sicherungs-Karte im Archiv erinnert jetzt automatisch, falls die letzte Sicherung mehr als 14 Tage her ist (oder noch nie gemacht wurde). Normale Versions-Updates brauchen weiterhin keine Sicherung – nur ein "Unpublish" würde das nötig machen.' },
  { v:7, date:'2026-09-24', notes:'Zeiteingabe umgebaut: 1. Platz bekommt die Bestzeit, alle anderen nur noch den Rückstand dazu, DNF per Häkchen statt Text. Statistik zeigt jetzt die aufsummierte Fahrzeit jedes Fahrers. Archiv nach Fahrer-Kombination filterbar. Sicherung hat einen eigenen Tab bekommen, inkl. Verlauf aller Exporte/Importe.' },
  { v:8, date:'2026-09-25', notes:'Echtes Rennen vom 24.09.2026 (Max, Bär, Andy, Dani, mit Streckennamen und Bestzeiten) aus einer hochgeladenen Sicherung nachträglich eingepflegt. Nebenbei: der Historien-Import kopiert jetzt auch Strafpunkte, Streckennamen und Bestzeiten mit, nicht nur die Punktetabelle.' },
  { v:9, date:'2026-09-25', notes:'Zeit-Eingabe strenger: 1. Platz mm:ss,SSS (Komma), alle anderen nur noch ss,SSS Rückstand. Falsches Format (z.B. Punkt statt Komma) wird direkt im Feld als Fehler markiert und blockiert das Speichern, damit in Strecken/Statistik keine kaputten Zeiten landen können.' },
  { v:10, date:'2026-09-25', notes:'Persönliche-Bestzeit-Meldung beim Eintragen von Streckenzeiten. CSV-Export im Sicherungs-Tab für Excel/Sheets. Session-Notizen (Freitextfeld) unterhalb der Punktetabelle im Rennen-Tab, sichtbar auch im Archiv.' },
  { v:11, date:'2026-09-25', notes:'Aktivitäts-Kalender in der Statistik (letzte 14 Wochen als Heatmap). Automatischer Abend-Rückblick nach "Fertig" (Sieger, meiste Platz-1, DNFs, engstes Rennen). QR-Code + Link-Kopieren im Sicherungs-Tab. Streak-Krone 👑 für die längste aktuelle Siegesserie, sichtbar bei der Fahrerauswahl und im Gesamtranking.' },
  { v:12, date:'2026-10-02', notes:'Speicher-Backend auf Firebase Realtime Database umgestellt (Echtzeit-Sync statt 5-Sekunden-Abfrage), gehostet über GitHub Pages. Bug behoben: Bei einem Verbindungsfehler blieb die App bisher für immer bei "Verbinde…" hängen, ohne eine Erklärung zu zeigen – jetzt wird die genaue Fehlermeldung angezeigt. Außerdem: Absturz behoben, falls Teilnehmer und Punktetabelle einer Session nicht exakt zusammenpassten (z.B. durch ältere Testdaten) – solche Einträge werden jetzt automatisch repariert statt die App zum Abstürzen zu bringen.' }
];

let state = null;
let currentView = 'rennen';
let statsFilter = { from: null, to: null }; // date-range filter for the Statistik tab, reset on reload
let draft = null;           // in-progress race being entered, not yet saved to the archive
let rennenPhase = 'idle';   // 'idle' | 'setup' | 'editing'
let storageAvailable = null; // null = not yet checked, true/false after first attempt

function todayStr(){ return new Date().toISOString().slice(0,10); }

function showStorageBanner(err){
  const b = document.getElementById('storageBanner');
  b.style.display = 'block';
  let msg = 'Live-Datenbank gerade nicht erreichbar – Ergebnisse bleiben nur auf diesem Gerät, bis die Verbindung wieder da ist. Prüfe deine Internetverbindung und die Firebase-Konfiguration oben im Code.';
  if(err && (err.code || err.message)){
    msg += ` (Fehler: ${err.code || err.message})`;
  }
  b.textContent = msg;
}

function migrateLegacyNames(state){
  const RENAME = { 'Andi': 'Andy', 'Mäcky': 'Mky', 'Mäkky': 'Mky' };
  const renameIn = (arr) => Array.isArray(arr) ? arr.map(n => RENAME[n] || n) : [];
  state.savedNames = renameIn(state.savedNames);
  state.selectedNames = renameIn(state.selectedNames);
  const migrateSessionLike = (s)=>{
    if (!s) return;
    s.participants = renameIn(s.participants);
    const newGrid = {};
    if (s.grid) {
      Object.entries(s.grid).forEach(([name, vals])=>{
        newGrid[RENAME[name] || name] = vals;
      });
    }
    s.grid = newGrid;
    if(s.penalties){
      const newPenalties = {};
      Object.entries(s.penalties).forEach(([name, val])=>{
        newPenalties[RENAME[name] || name] = val;
      });
      s.penalties = newPenalties;
    }
  };
  if (Array.isArray(state.sessions)) {
    state.sessions.forEach(migrateSessionLike);
  }
  if(state.liveDraft) migrateSessionLike(state.liveDraft);
}

function sanitizeSessionLike(s){
  // Returns false if the session is unusable (caller should drop it);
  // otherwise guarantees every participant has a grid array of equal,
  // consistent length - the one invariant every other function relies on.
  // This is a defense-in-depth layer: several render functions already
  // guard themselves individually, but repairing the data once here,
  // right after it arrives from Firebase, means every function (including
  // ones added later) can safely assume well-formed sessions.
  if(!s || !Array.isArray(s.participants) || s.participants.length===0 || !s.grid || typeof s.grid !== 'object') return false;
  let rounds = 1;
  s.participants.forEach(p=>{
    if(Array.isArray(s.grid[p])) rounds = Math.max(rounds, s.grid[p].length);
  });
  s.participants.forEach(p=>{
    if(!Array.isArray(s.grid[p])) s.grid[p] = [];
    while(s.grid[p].length < rounds) s.grid[p].push(null);
  });
  if(s.trackTimes && typeof s.trackTimes === 'object'){
    s.participants.forEach(p=>{
      if(!Array.isArray(s.trackTimes[p])) s.trackTimes[p] = [];
      while(s.trackTimes[p].length < rounds) s.trackTimes[p].push(null);
    });
  }
  if(s.trackNames && Array.isArray(s.trackNames)){
    while(s.trackNames.length < rounds) s.trackNames.push('');
  }
  return true;
}

function formatMsToTime(ms){
  if(ms===null || ms===undefined || isNaN(ms)) return '';
  const totalMs = Math.max(0, Math.round(ms));
  const min = Math.floor(totalMs/60000);
  const sec = Math.floor((totalMs%60000)/1000);
  const msPart = totalMs%1000;
  return `${min}:${String(sec).padStart(2,'0')},${String(msPart).padStart(3,'0')}`;
}

function formatDurationMs(ms){
  if(!ms) return '–';
  const totalSec = Math.round(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

const LEADER_TIME_RE = /^\d{1,2}:\d{2},\d{3}$/;
const GAP_TIME_RE = /^\d{1,3},\d{3}$/;

function formatGapDisplay(ms){
  if(ms===null || ms===undefined || isNaN(ms)) return '';
  const totalMs = Math.max(0, Math.round(ms));
  const sec = Math.floor(totalMs/1000);
  const msPart = totalMs%1000;
  return `${String(sec).padStart(2,'0')},${String(msPart).padStart(3,'0')}`;
}

function showTrackEditor(roundIndex){
  if(!draft) return;
  const currentName = (draft.trackNames && draft.trackNames[roundIndex]) || '';
  const N = draft.participants.length;

  let leaderName = null;
  draft.participants.forEach(name=>{
    const pv = draft.grid[name] ? draft.grid[name][roundIndex] : null;
    if(asPlacementNumber(pv) === 1) leaderName = name;
  });
  if(!leaderName) leaderName = draft.participants[0];

  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `<div class="confirm-box" style="max-width:380px;text-align:left;">
    <h2 style="font-family:var(--font-display);font-size:16px;margin:0 0 12px;">Track ${roundIndex+1}</h2>
    <label style="display:block;font-size:11px;color:var(--muted);margin-bottom:6px;">Streckenname</label>
    <input type="text" id="trackNameInputModal" value="${escapeHtml(currentName)}" placeholder="z.B. Canyon Speed" style="width:100%;margin-bottom:14px;" />
    <label style="display:block;font-size:11px;color:var(--muted);margin-bottom:8px;">Zeiten (1. Platz = Bestzeit, alle anderen = Rückstand)</label>
    <div id="trackRowsContainer"></div>
    <div class="confirm-actions" style="margin-top:10px;">
      <button id="trackEditorCancelBtn">Abbrechen</button>
      <button class="primary" id="trackEditorSaveBtn">Speichern</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  function getLeaderMs(){
    const inp = overlay.querySelector('.track-time-input[data-track-name]');
    return inp ? parseTimeToMs(inp.value) : null;
  }

  function validateField(inp, isLeader){
    const wrap = inp.closest('.track-time-field');
    const errEl = wrap ? wrap.querySelector('.track-time-error') : null;
    const raw = inp.value.trim();
    if(raw === ''){
      inp.classList.remove('time-invalid');
      if(errEl) errEl.style.display = 'none';
      return true;
    }
    const re = isLeader ? LEADER_TIME_RE : GAP_TIME_RE;
    const ok = re.test(raw);
    inp.classList.toggle('time-invalid', !ok);
    if(errEl) errEl.style.display = ok ? 'none' : 'block';
    return ok;
  }

  function renderRows(){
    const leaderTimeStrRaw = (draft.trackTimes && draft.trackTimes[leaderName] && draft.trackTimes[leaderName][roundIndex]) || '';
    const leaderMs = parseTimeToMs(leaderTimeStrRaw);
    const leaderTimeDisplay = leaderMs!==null ? formatMsToTime(leaderMs) : '';

    const container = document.getElementById('trackRowsContainer');
    container.innerHTML = draft.participants.map(name=>{
      const pv = draft.grid[name] ? draft.grid[name][roundIndex] : null;
      const dnfDefault = pv==='DNF' || (typeof pv==='number' && pv===N+1);
      const isLeader = name===leaderName;
      let fieldValue = '';
      if(isLeader){
        fieldValue = leaderTimeDisplay;
      } else if(!dnfDefault && leaderMs!==null){
        const ownMs = parseTimeToMs((draft.trackTimes && draft.trackTimes[name] && draft.trackTimes[name][roundIndex]) || '');
        if(ownMs!==null && ownMs>=leaderMs) fieldValue = formatGapDisplay(ownMs-leaderMs);
      }
      const errMsg = isLeader ? 'Format: mm:ss,SSS (z.B. 0:47,325)' : 'Format: ss,SSS (z.B. 01,500)';
      return `<div class="track-time-field" style="margin-bottom:10px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <label style="display:flex;align-items:center;gap:4px;flex-shrink:0;" title="Als 1. Platz / Bestzeit-Referenz festlegen">
            <input type="radio" name="leaderRadio" class="leader-radio" data-track-name="${escapeHtml(name)}" ${isLeader?'checked':''} />
          </label>
          <div style="flex:1;font-size:14px;">${escapeHtml(name)}</div>
          <input type="text" class="track-time-input" data-track-name="${escapeHtml(name)}" data-is-leader="${isLeader}"
            placeholder="${isLeader?'mm:ss,SSS':'ss,SSS'}" value="${escapeHtml(fieldValue)}"
            style="width:110px;text-align:center;" ${!isLeader && dnfDefault ? 'disabled':''} />
          <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);flex-shrink:0;">
            <input type="checkbox" class="track-dnf-check" data-track-name="${escapeHtml(name)}" ${dnfDefault?'checked':''} /> DNF
          </label>
        </div>
        <div class="track-time-error" style="display:none;color:var(--danger);font-size:11px;margin-top:4px;margin-left:26px;">${escapeHtml(errMsg)}</div>
      </div>`;
    }).join('');

    container.querySelectorAll('.leader-radio').forEach(r=>{
      r.onchange = ()=>{ leaderName = r.dataset.trackName; renderRows(); };
    });
    container.querySelectorAll('.track-dnf-check').forEach(cb=>{
      cb.onchange = ()=>{
        const timeInp = container.querySelector(`.track-time-input[data-track-name="${cssEscape(cb.dataset.trackName)}"]`);
        if(timeInp){
          timeInp.disabled = cb.checked;
          if(cb.checked){ timeInp.value = ''; validateField(timeInp, timeInp.dataset.isLeader==='true'); }
        }
      };
    });
    container.querySelectorAll('.track-time-input').forEach(inp=>{
      inp.addEventListener('blur', ()=> validateField(inp, inp.dataset.isLeader==='true'));
      inp.addEventListener('input', ()=>{
        const wrap = inp.closest('.track-time-field');
        const errEl = wrap ? wrap.querySelector('.track-time-error') : null;
        if(errEl && errEl.style.display !== 'none'){ inp.classList.remove('time-invalid'); errEl.style.display = 'none'; }
      });
    });
  }
  renderRows();

  const close = ()=> overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target === overlay) close(); });
  document.getElementById('trackEditorCancelBtn').onclick = close;
  document.getElementById('trackEditorSaveBtn').onclick = ()=>{
    let allValid = true;
    overlay.querySelectorAll('.track-time-input').forEach(inp=>{
      if(inp.disabled) return;
      const ok = validateField(inp, inp.dataset.isLeader==='true');
      if(!ok) allValid = false;
    });
    if(!allValid){
      showToast('Bitte Zeitformat korrigieren (Komma statt Punkt, siehe Hinweis)');
      return;
    }

    const name = document.getElementById('trackNameInputModal').value.trim();
    if(!draft.trackNames) draft.trackNames = [];
    draft.trackNames[roundIndex] = name;
    if(!draft.trackTimes) draft.trackTimes = {};

    const previousBests = {};
    if(name){
      draft.participants.forEach(pname=>{ previousBests[pname] = getPersonalBestMs(pname, name); });
    }

    const leaderMs = getLeaderMs();
    const newTimesMs = {};
    draft.participants.forEach(pname=>{
      if(!draft.trackTimes[pname]) draft.trackTimes[pname] = [];
      const dnfChecked = overlay.querySelector(`.track-dnf-check[data-track-name="${cssEscape(pname)}"]`).checked;
      if(dnfChecked){
        draft.trackTimes[pname][roundIndex] = null;
        return;
      }
      const inp = overlay.querySelector(`.track-time-input[data-track-name="${cssEscape(pname)}"]`);
      const raw = inp.value.trim();
      let finalMs = null;
      if(pname === leaderName){
        finalMs = raw ? parseTimeToMs(raw) : null;
      } else if(raw && leaderMs!==null){
        const gapMs = parseTimeToMs(raw);
        finalMs = gapMs===null ? null : leaderMs + gapMs;
      }
      draft.trackTimes[pname][roundIndex] = finalMs===null ? null : formatMsToTime(finalMs);
      newTimesMs[pname] = finalMs;
    });
    saveDraft();
    close();
    renderRennen();

    if(name){
      const achievers = draft.participants.filter(pname=>
        newTimesMs[pname]!==null && previousBests[pname]!==null && newTimesMs[pname] < previousBests[pname]
      );
      if(achievers.length){
        const msg = achievers.length===1
          ? `🏆 Neue Bestzeit für ${achievers[0]} auf ${name}: ${formatMsToTime(newTimesMs[achievers[0]])}!`
          : `🏆 Neue Bestzeiten auf ${name}: ${achievers.map(a=>`${a} (${formatMsToTime(newTimesMs[a])})`).join(', ')}!`;
        showToast(msg, 4200);
      }
    }
  };
}

/* ============================================================
   PERSISTENCE LAYER - Firebase Realtime Database
   ============================================================
*/
const firebaseConfig = {
  databaseURL: "https://trkmn-44c02-default-rtdb.europe-west1.firebasedatabase.app"
};

let dbRef = null;
let firebaseReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  dbRef = firebase.database().ref('tm_scoreboard_state');
  firebaseReady = true;
}catch(e){
  console.error('Firebase init failed - check firebaseConfig at the top of the script.', e);
}

let saveInFlight = 0;
let firstLoadDone = false;

function loadState(){
  if(!firebaseReady){
    storageAvailable = false;
    state = defaultState();
    migrateLegacyNames(state);
    showStorageBanner();
    syncDraftFromState();
    render();
    return;
  }

  dbRef.on('value', (snapshot)=>{
    const val = snapshot.val();
    const fresh = (val && typeof val === 'object') ? val : defaultState();

    migrateLegacyNames(fresh);
    if(!Array.isArray(fresh.savedNames)) fresh.savedNames = [...FIXED_DRIVERS];
    if(!Array.isArray(fresh.selectedNames)) fresh.selectedNames = [...FIXED_DRIVERS];
    if(!Array.isArray(fresh.sessions)) fresh.sessions = [];
    FIXED_DRIVERS.forEach(n=>{ if(!fresh.savedNames.includes(n)) fresh.savedNames.push(n); });
    fresh.savedNames = [...new Set(fresh.savedNames)];
    fresh.selectedNames = [...new Set(fresh.selectedNames)];
    // Guard against malformed/legacy data (e.g. from an earlier, simpler
    // version of this app) where a session's participants and its grid
    // don't fully match up - repair or drop anything that doesn't fit,
    // BEFORE any render function ever touches it.
    fresh.sessions = fresh.sessions.filter(s=>sanitizeSessionLike(s));
    if(fresh.liveDraft && !sanitizeSessionLike(fresh.liveDraft)) fresh.liveDraft = null;

    storageAvailable = true;
    hideStorageBanner();

    if(!firstLoadDone){
      firstLoadDone = true;
      state = fresh;
      let needsSave = false;
      if(state.selectedDate !== todayStr()){ state.selectedDate = todayStr(); needsSave = true; }
      syncDraftFromState();
      if(needsSave) saveState();
      render();
      return;
    }

    if(isTypingNow()) return;
    if(saveInFlight > 0) return;
    if(JSON.stringify(fresh) !== JSON.stringify(state)){
      state = fresh;
      syncDraftFromState();
      render();
    }
  }, (err)=>{
    console.error('Firebase sync error:', err);
    storageAvailable = false;
    showStorageBanner(err);
    if(!firstLoadDone){
      firstLoadDone = true;
      state = defaultState();
      syncDraftFromState();
      render();
    }
  });
}

function syncDraftFromState(){
  draft = state.liveDraft || null;
  rennenPhase = draft ? 'editing' : 'idle';
}

async function saveDraft(){
  state.liveDraft = draft;
  await saveState();
}

async function clearDraft(){
  draft = null;
  rennenPhase = 'idle';
  state.liveDraft = null;
  await saveState();
}

async function saveState(){
  if(!firebaseReady){
    storageAvailable = false;
    showStorageBanner();
    return;
  }
  saveInFlight++;
  try{
    await dbRef.set(state);
    storageAvailable = true;
    hideStorageBanner();
  }catch(e){
    console.error('Firebase save failed:', e);
    storageAvailable = false;
    showStorageBanner();
  }finally{
    saveInFlight--;
  }
}

function isTypingNow(){
  const a = document.activeElement;
  return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function sameSet(a,b){
  if(!Array.isArray(a) || !Array.isArray(b)) return false;
  if(a.length!==b.length) return false;
  const sa=[...a].sort(), sb=[...b].sort();
  return sa.every((v,i)=>v===sb[i]);
}

function getStreakCrownHolder(){
  if (!state || !Array.isArray(state.sessions)) return null;

  const complete = state.sessions
    .filter(s => s && Array.isArray(s.participants) && s.grid && s.participants.every(n => Array.isArray(s.grid[n]) && s.grid[n].every(v => v !== null && v !== undefined)))
    .slice().sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));

  const perDriverSeq = {};
  complete.forEach(s => {
    const totals = sessionTotals(s);
    const winnerEntry = Object.entries(totals).sort((a,b) => a[1] - b[1])[0];
    if (!winnerEntry) return;
    const winner = winnerEntry[0];
    s.participants.forEach(name => {
      (perDriverSeq[name] = perDriverSeq[name] || []).push(name === winner);
    });
  });

  let bestName = null, bestStreak = 1;
  Object.entries(perDriverSeq).forEach(([name, seq]) => {
    let streak = 0;
    for(let i = seq.length - 1; i >= 0; i--){
      if(seq[i]) streak++; else break;
    }
    if(streak > bestStreak){ bestStreak = streak; bestName = name; }
  });
  return bestName ? { name: bestName, streak: bestStreak } : null;
}

function orderedSavedNames(){
  const canonicalOrder = ['Max','Andy','Dani','Olly','Bär','Mky'];
  const saved = Array.isArray(state?.savedNames) ? state.savedNames : [];
  const known = canonicalOrder.filter(n=>saved.includes(n));
  const extra = saved.filter(n=>!canonicalOrder.includes(n));
  return [...known, ...extra];
}

/* ---------------- RENNEN ---------------- */
function renderRennen(){
  const dateCard = document.getElementById('dateCard');
  const driversCard = document.getElementById('driversCard');
  const area = document.getElementById('raceArea');

  if(rennenPhase === 'editing' && draft){
    dateCard.style.display = 'none';
    driversCard.style.display = 'none';
    renderEditingPhase(area);
    return;
  }

  dateCard.style.display = 'block';
  driversCard.style.display = 'block';
  const grid = document.getElementById('chipGrid');
  grid.innerHTML = '';
  const crownHolder = getStreakCrownHolder();
  orderedSavedNames().forEach(name=>{
    const active = Array.isArray(state?.selectedNames) && state.selectedNames.includes(name);
    const chip = document.createElement('div');
    chip.className = 'chip' + (active?' active':'');
    chip.textContent = name + (crownHolder && crownHolder.name===name ? ' 👑' : '');
    if(crownHolder && crownHolder.name===name) chip.title = `${crownHolder.streak}x in Folge gewonnen`;
    chip.onclick = ()=>toggleSelected(name);
    grid.appendChild(chip);
  });

  if(rennenPhase === 'idle'){
    area.innerHTML = `<div class="card" style="text-align:center;">
      <button class="primary full" id="startNewRaceBtn">Neues Rennen starten</button>
    </div>`;
    document.getElementById('startNewRaceBtn').onclick = ()=>{
      rennenPhase = 'setup';
      renderRennen();
    };
    return;
  }

  const n = state.selectedNames.length;
  area.innerHTML = `<div class="card">
    <p class="muted" style="margin:0 0 12px;">${n<2 ? 'Wähle mindestens 2 Fahrer aus.' : `${n} Fahrer ausgewählt.`}</p>
    <button class="primary full" id="continueSetupBtn" ${n<2?'disabled':''}>Weiter</button>
  </div>`;
  document.getElementById('continueSetupBtn').onclick = ()=>continueToEditing();
}

function continueToEditing(){
  if(state.selectedNames.length < 2) return;
  const lastMatch = state.sessions
    .filter(s=>sameSet(s.participants, state.selectedNames))
    .slice().sort((a,b)=> b.date.localeCompare(a.date))[0] || null;

  let order;
  let lastMatchInfo = null;
  if(lastMatch){
    const totals = sessionTotals(lastMatch);
    order = Object.entries(totals).sort((a,b)=>a[1]-b[1]).map(([name])=>name);
    lastMatchInfo = { date: lastMatch.date, standing: totals };
  } else {
    order = [...state.selectedNames];
  }

  const g = {};
  const penalties = {};
  const trackNames = new Array(order.length+1).fill('');
  const trackTimes = {};
  order.forEach(n=>{
    g[n] = new Array(order.length+1).fill(null);
    penalties[n] = 0;
    trackTimes[n] = new Array(order.length+1).fill(null);
  });

  draft = { id: null, date: state.selectedDate, participants: order, grid: g, penalties, trackNames, trackTimes, note: '', lastMatchInfo };
  rennenPhase = 'editing';
  saveDraft();
  renderRennen();
}

function sessionTotals(session){
  const totals = {};
  if (!session || !Array.isArray(session.participants)) return totals;
  session.participants.forEach(p=>totals[p]=0);
  const N = session.participants.length;
  session.participants.forEach(name=>{
    const arr = (session.grid && session.grid[name]) ? session.grid[name] : [];
    arr.forEach(val=>{
      if(val===null || val===undefined || val==='') return;
      if(val==='DNF'){ totals[name] += N+1; return; }
      const n = asPlacementNumber(val);
      if(n!==null) totals[name] += n;
    });
    const penalty = session.penalties && session.penalties[name];
    if(penalty){ totals[name] += Number(penalty) || 0; }
  });
  return totals;
}

function normalizeCellValue(raw){
  let v = String(raw || '').trim();
  if(v === '') return null;
  if(v.toUpperCase() === 'DNF') return 'DNF';
  if(v === '0') return 'DNF';
  let starred = false;
  if(v.endsWith('*')){ starred = true; v = v.slice(0,-1); }
  const n = parseInt(v, 10);
  if(isNaN(n) || n < 1) return null;
  return starred ? (n + '*') : n;
}

function asPlacementNumber(val){
  if(typeof val === 'number') return val;
  if(typeof val === 'string' && val !== 'DNF' && val.endsWith('*')){
    const n = parseInt(val, 10);
    return isNaN(n) ? null : n;
  }
  return null;
}
function isStarredValue(val){
  return typeof val === 'string' && val !== 'DNF' && val.endsWith('*');
}

function onDraftCellChange(input){
  const name = input.dataset.name;
  const round = parseInt(input.dataset.round, 10);
  const val = normalizeCellValue(input.value);
  if (!draft.grid[name]) draft.grid[name] = [];
  draft.grid[name][round] = val;
  input.value = val===null ? '' : val;
  input.classList.toggle('dnf', val==='DNF');
  input.classList.toggle('star', isStarredValue(val));
  saveDraft();
  updateSumsAndStandings(draft);
}

function onPenaltyChange(input){
  const name = input.dataset.penaltyName;
  const raw = input.value.trim();
  const n = raw === '' ? 0 : parseInt(raw, 10);
  const val = (isNaN(n) || n < 0) ? 0 : n;
  if(!draft.penalties) draft.penalties = {};
  draft.penalties[name] = val;
  input.value = val ? String(val) : '';
  saveDraft();
  updateSumsAndStandings(draft);
}

function showFinishOverlay(session, isMilestone, sessionCount){
  const recapHtml = buildSessionRecapHtml(session);
  if(isMilestone){
    const isBig = (sessionCount===100 || sessionCount===200);
    showMilestoneModal(sessionCount, isBig, recapHtml);
  } else if(recapHtml){
    showSessionRecap(session);
  }
}

function commitDraftToArchive(){
  const copy = JSON.parse(JSON.stringify(draft));
  let isNewSession = false;
  if(draft.id){
    const idx = state.sessions.findIndex(s=>s.id===draft.id);
    if(idx>=0) state.sessions[idx] = copy;
    else { state.sessions.push(copy); isNewSession = true; }
  } else {
    draft.id = 's'+Date.now();
    copy.id = draft.id;
    state.sessions.push(copy);
    isNewSession = true;
  }
  saveDraft();
  return { session: copy, isNewSession };
}

function buildSessionRecapHtml(s){
  if (!s || !Array.isArray(s.participants)) return '';
  const N = s.participants.length;
  const totals = sessionTotals(s);
  const ranked = Object.entries(totals).sort((a,b)=>a[1]-b[1]);
  if(ranked.length===0) return '';
  const winner = ranked[0][0];

  const winCounts = {};
  const dnfCounts = {};
  let anyStar = null;
  s.participants.forEach(name=>{
    winCounts[name] = 0; dnfCounts[name] = 0;
    ((s.grid && s.grid[name])||[]).forEach(val=>{
      if(val===null||val===undefined) return;
      const isDnf = val==='DNF' || (typeof val==='number' && val===N+1);
      if(isDnf){ dnfCounts[name]++; return; }
      const num = asPlacementNumber(val);
      if(num===1) winCounts[name]++;
      if(isStarredValue(val) && !anyStar) anyStar = name;
    });
  });

  const lines = [];
  lines.push(`🏆 Sieger des Abends: <b style="color:var(--text);">${escapeHtml(winner)}</b> (${ranked[0][1]} Punkte)`);

  const topWinner = Object.entries(winCounts).sort((a,b)=>b[1]-a[1])[0];
  if(topWinner && topWinner[1] > 0){
    lines.push(`🥇 ${escapeHtml(topWinner[0])} holte ${topWinner[1]}x Platz 1`);
  }
  const topDnf = Object.entries(dnfCounts).sort((a,b)=>b[1]-a[1])[0];
  if(topDnf && topDnf[1] > 0){
    lines.push(`💥 ${escapeHtml(topDnf[0])} kassierte ${topDnf[1]} DNF${topDnf[1]>1?'s':''}`);
  }
  if(anyStar){
    lines.push(`🌟 ${escapeHtml(anyStar)} rettete sich mit dem letzten Tropfen Benzin auf Platz 1!`);
  }

  let closest = null;
  const rounds = s.participants.length && s.grid[s.participants[0]] ? s.grid[s.participants[0]].length : 0;
  for(let r=0;r<rounds;r++){
    const times = s.participants
      .map(name=> ({ name, ms: s.trackTimes && s.trackTimes[name] ? parseTimeToMs(s.trackTimes[name][r]) : null }))
      .filter(t=>t.ms!==null)
      .sort((a,b)=>a.ms-b.ms);
    if(times.length>=2){
      const gap = times[1].ms - times[0].ms;
      if(!closest || gap < closest.gap) closest = { round:r+1, gap, trackName: (s.trackNames&&s.trackNames[r])||('Track '+(r+1)) };
    }
  }
  if(closest){
    lines.push(`⏱️ Engstes Rennen: ${escapeHtml(closest.trackName)} (nur ${formatGapDisplay(closest.gap)}s Unterschied)`);
  }

  return lines.map(l=>`<div style="margin-bottom:8px;font-size:14px;">${l}</div>`).join('');
}

function updateSumsAndStandings(session){
  if (!session || !Array.isArray(session.participants)) return;
  const N = session.participants.length;
  const rounds = (N > 0 && session.grid[session.participants[0]]) ? session.grid[session.participants[0]].length : N + 1;
  const totals = sessionTotals(session);

  session.participants.forEach(name=>{
    const cell = document.querySelector(`[data-sumfor="${cssEscape(name)}"]`);
    if(cell) cell.textContent = totals[name];
  });

  const warnings = [];
  for(let r=0;r<rounds;r++){
    const vals = session.participants.map(name=> (session.grid[name] ? asPlacementNumber(session.grid[name][r]) : null)).filter(v=>v!==null && v !== N+1);
    const seen = new Set(); const dups = new Set();
    vals.forEach(v=>{ if(seen.has(v)) dups.add(v); seen.add(v); });
    if(dups.size>0) warnings.push(`Track ${r+1}: Platz ${[...dups].join(', ')} mehrfach vergeben`);
  }
  const warnEl = document.getElementById('warnNote');
  if(warnEl){
    warnEl.innerHTML = warnings.length
      ? warnings.map(w=>`<div class="warn-note">${escapeHtml(w)}</div>`).join('')
      : '';
  }
  document.querySelectorAll('.cell-input[data-name]').forEach(inp=>{
    const r = parseInt(inp.dataset.round,10);
    const v = normalizeCellValue(inp.value);
    const num = asPlacementNumber(v);
    const isDup = num!==null && num !== N+1 && warnings.some(w=>w.startsWith(`Track ${r+1}:`));
    inp.classList.toggle('dup', !!isDup);
  });

  const sorted = Object.entries(totals).sort((a,b)=>a[1]-b[1]);
  const list = document.getElementById('standingList');
  if(list){
    list.innerHTML = sorted.map(([name,pts],i)=>{
      const cls = i===0?'p1':i===1?'p2':i===2?'p3':'';
      const badge = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
      return `<div class="result-row">
        <div class="rank-badge ${cls}">${badge}</div>
        <div class="name">${escapeHtml(name)}</div>
        <div class="pts">${pts}</div>
      </div>`;
    }).join('');
  }
}

/* ---------------- ARCHIV ---------------- */
function parseTimeToMs(str){
  let s = (str||'').trim();
  if(!s) return null;
  s = s.replace(/,/g, '.').replace(/s(ec)?$/i, '').trim();
  if(!s) return null;
  const groups = s.split(/[:.]/).filter(p=>p!=='');
  if(groups.length===0 || groups.some(p=>!/^\d+$/.test(p))) return null;

  let min=0, sec=0, ms=0;
  if(s.includes(':')){
    const afterLastColon = s.split(':').pop();
    const msParts = afterLastColon.split('.');
    sec = +msParts[0];
    if(msParts[1]) ms = +msParts[1].padEnd(3,'0').slice(0,3);
    const beforeLastColon = s.slice(0, s.length - afterLastColon.length - 1);
    const minGroups = beforeLastColon.split(':').filter(p=>p!=='');
    min = minGroups.reduce((acc,p)=> acc*60 + (+p||0), 0);
  } else {
    const dotParts = s.split('.').filter(p=>p!=='');
    if(dotParts.length===1){ sec = +dotParts[0]; }
    else if(dotParts.length===2){ sec = +dotParts[0]; ms = +dotParts[1].padEnd(3,'0').slice(0,3); }
    else { min = +dotParts[0]; sec = +dotParts[1]; ms = +(dotParts[2]||'0').padEnd(3,'0').slice(0,3); }
  }
  return min*60000 + sec*1000 + ms;
}

function getPersonalBestMs(driverName, trackNameRaw){
  const key = (trackNameRaw||'').trim().toLowerCase();
  if(!key || !state || !Array.isArray(state.sessions)) return null;
  let best = null;
  state.sessions.forEach(s=>{
    if(!s.trackNames) return;
    s.trackNames.forEach((tname, r)=>{
      if((tname||'').trim().toLowerCase() !== key) return;
      const timeStr = s.trackTimes && s.trackTimes[driverName] && s.trackTimes[driverName][r];
      if(!timeStr) return;
      const ms = parseTimeToMs(timeStr);
      if(ms!==null && (best===null || ms<best)) best = ms;
    });
  });
  return best;
}

function renderStrecken(){
  const el = document.getElementById('streckenContent');
  if (!el || !state || !Array.isArray(state.sessions)) return;
  const tracks = {};
  state.sessions.forEach(s=>{
    if(!s.trackNames) return;
    s.trackNames.forEach((tname, r)=>{
      const raw = (tname||'').trim();
      if(!raw) return;
      const key = raw.toLowerCase();
      if(!tracks[key]) tracks[key] = { displayName: raw, entries: {} };
      s.participants.forEach(driver=>{
        const timeStr = s.trackTimes && s.trackTimes[driver] && s.trackTimes[driver][r];
        if(!timeStr) return;
        const ms = parseTimeToMs(timeStr);
        const cur = tracks[key].entries[driver];
        const sortKey = ms===null ? Infinity : ms;
        const curSortKey = cur ? (cur.ms===null ? Infinity : cur.ms) : Infinity;
        if(!cur || sortKey < curSortKey){
          tracks[key].entries[driver] = { ms, timeStr, date: s.date };
        }
      });
    });
  });

  const trackKeys = Object.keys(tracks).sort((a,b)=> tracks[a].displayName.localeCompare(tracks[b].displayName));
  if(trackKeys.length === 0){
    el.innerHTML = '<div class="empty">Noch keine Streckennamen/Bestzeiten eingetragen.<br>Im Rennen-Tab auf einen Spaltenkopf (T1, T2, …) tippen.</div>';
    return;
  }

  el.innerHTML = trackKeys.map(key=>{
    const t = tracks[key];
    const entries = Object.entries(t.entries).sort((a,b)=>{
      const am = a[1].ms===null ? Infinity : a[1].ms;
      const bm = b[1].ms===null ? Infinity : b[1].ms;
      return am-bm;
    });
    return `<div class="card">
      <h2>${escapeHtml(t.displayName)}</h2>
      <div class="standing-list">
        ${entries.map(([driver,info],i)=>{
          const cls = i===0?'p1':i===1?'p2':i===2?'p3':'';
          const badge = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
          const timeLabel = info.ms===null ? (info.timeStr + ' ⚠︎') : info.timeStr;
          return `<div class="result-row">
            <div class="rank-badge ${cls}">${badge}</div>
            <div class="name">${escapeHtml(driver)}<div class="breakdown"><span>${formatDate(info.date)}</span></div></div>
            <div class="pts">${escapeHtml(timeLabel)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function buildReadOnlyGridHtml(s){
  if (!s || !s.grid || !Array.isArray(s.participants) || !s.participants[0] || !s.grid[s.participants[0]]) {
    return '<div class="empty">Keine Daten verfügbar.</div>';
  }
  const rounds = s.grid[s.participants[0]].length;
  let html = `<div class="table-wrap"><table class="grid"><thead><tr><th class="namecol">Fahrer</th>`;
  for(let r=1;r<=rounds;r++){
    const tname = (s.trackNames && s.trackNames[r-1]) ? s.trackNames[r-1] : '';
    html += `<th title="${tname ? escapeHtml(tname) : ''}">${tname ? escapeHtml(tname.length>6?tname.slice(0,6)+'…':tname) : 'T'+r}</th>`;
  }
  html += `<th>Straf.</th><th class="sumcol">Σ</th></tr></thead><tbody>`;
  const totals = sessionTotals(s);
  s.participants.forEach(name=>{
    html += `<tr><td class="namecol">${escapeHtml(name)}</td>`;
    const arr = s.grid[name] || [];
    for(let r=0;r<rounds;r++){
      const val = arr[r];
      const display = (val===null||val===undefined) ? '–' : String(val);
      const cls = val==='DNF' ? 'dnf' : (isStarredValue(val) ? 'star' : '');
      html += `<td><span class="ro-cell ${cls}">${escapeHtml(display)}</span></td>`;
    }
    const penaltyVal = (s.penalties && s.penalties[name]) || 0;
    html += `<td><span class="ro-cell">${penaltyVal || '–'}</span></td>`;
    html += `<td class="sumcol">${totals[name] || 0}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  if(s.note){
    html += `<p class="muted" style="margin-top:10px;white-space:pre-wrap;">📝 ${escapeHtml(s.note)}</p>`;
  }
  return html;
}

function daysSince(dateStr){
  if(!dateStr) return null;
  const then = new Date(dateStr+'T00:00:00').getTime();
  const now = new Date(todayStr()+'T00:00:00').getTime();
  return Math.round((now-then) / 86400000);
}

function backupCardHtml(){
  const days = daysSince(state?.lastExportDate);
  let reminder = '';
  if(days === null){
    reminder = `<p class="warn-note" style="margin:0 0 12px;">Noch nie exportiert – am besten gleich einmal eine Sicherung anlegen.</p>`;
  } else if(days >= 14){
    reminder = `<p class="warn-note" style="margin:0 0 12px;">Letzte Sicherung ist ${days} Tage her.</p>`;
  }
  return `<div class="card">
    <h2>Sicherung</h2>
    ${reminder}
    <p class="muted" style="margin:0 0 12px;">Lädt alle Rennen als Datei herunter bzw. spielt eine solche Datei wieder ein (bestehende Einträge bleiben dabei erhalten, nur fehlende werden ergänzt). Nur nötig, falls jemals ein "Unpublish" gemacht werden muss – normale Updates brauchen das nicht.</p>
    <div class="section-actions" style="margin-top:0;">
      <button id="exportBackupBtn">Exportieren (JSON)</button>
      <button id="importBackupBtn">Importieren</button>
    </div>
    <input type="file" id="importBackupFile" accept="application/json" style="display:none;" />
    <div class="section-actions">
      <button id="exportCsvBtn">Als CSV exportieren (Excel/Sheets)</button>
    </div>
  </div>`;
}

function wireBackupButtons(){
  const exportBtn = document.getElementById('exportBackupBtn');
  if(exportBtn) exportBtn.onclick = exportBackup;
  const importBtn = document.getElementById('importBackupBtn');
  const fileInput = document.getElementById('importBackupFile');
  if(importBtn && fileInput){
    importBtn.onclick = ()=> fileInput.click();
    fileInput.onchange = ()=>{
      if(fileInput.files && fileInput.files[0]) importBackupFile(fileInput.files[0]);
      fileInput.value = '';
    };
  }
  const csvBtn = document.getElementById('exportCsvBtn');
  if(csvBtn) csvBtn.onclick = exportCsv;
}

function csvEscapeField(v){
  const s = String(v===null||v===undefined ? '' : v);
  if(s.includes(';') || s.includes('"') || s.includes('\n') || s.includes('\r')){
    return '"' + s.replace(/"/g,'""') + '"';
  }
  return s;
}

function exportCsv(){
  const sessions = (state?.sessions || []).slice().sort((a,b)=> a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  const maxRounds = sessions.reduce((m,s)=> Math.max(m, (s.participants && s.grid && s.grid[s.participants[0]]) ? s.grid[s.participants[0]].length : 0), 1);

  const headers = ['Datum','Fahrer','Besetzung'];
  for(let i=1;i<=maxRounds;i++) headers.push('Track'+i);
  headers.push('Punkte_Gesamt','Strafpunkte','DNFs','Notiz');

  const rows = [headers];
  sessions.forEach(s=>{
    const totals = sessionTotals(s);
    const besetzung = s.participants.join('+');
    const N = s.participants.length;
    s.participants.forEach(name=>{
      const row = [s.date, name, besetzung];
      const arr = s.grid[name] || [];
      for(let i=0;i<maxRounds;i++){
        const v = arr[i];
        row.push(v===null||v===undefined ? '' : String(v));
      }
      row.push(String(totals[name]||0));
      row.push(String((s.penalties && s.penalties[name]) || 0));
      const dnfCount = arr.filter(v => v==='DNF' || (typeof v==='number' && v===N+1)).length;
      row.push(String(dnfCount));
      row.push(s.note || '');
      rows.push(row);
    });
  });

  const csvContent = rows.map(r=> r.map(csvEscapeField).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `trackmania-export-${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  logBackupEvent('export-csv', { sessionCount: sessions.length });
  saveState();
  showToast('CSV heruntergeladen');
  renderCurrentView();
}

function logBackupEvent(type, extra){
  if(!Array.isArray(state.backupHistory)) state.backupHistory = [];
  state.backupHistory.push(Object.assign({
    type,
    date: todayStr(),
    time: new Date().toISOString(),
    version: APP_VERSION
  }, extra||{}));
  if(state.backupHistory.length > 100) state.backupHistory = state.backupHistory.slice(-100);
}

function exportBackup(){
  const payload = Object.assign({}, state, { exportedFromVersion: APP_VERSION, exportedAt: new Date().toISOString() });
  const dataStr = JSON.stringify(payload, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `trackmania-sicherung-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  state.lastExportDate = todayStr();
  logBackupEvent('export', { sessionCount: state.sessions.length });
  saveState();
  showToast('Sicherung heruntergeladen');
  renderCurrentView();
}

function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    let backup;
    try{
      backup = JSON.parse(e.target.result);
    }catch(err){
      showToast('Datei konnte nicht gelesen werden');
      return;
    }
    if(!backup || !Array.isArray(backup.sessions)){
      showToast('Ungültige Sicherungsdatei');
      return;
    }
    const existingIds = new Set(state.sessions.map(s=>s.id));
    const toAdd = backup.sessions.filter(s=>s && s.id && !existingIds.has(s.id));
    showConfirm(`${toAdd.length} fehlende Renn-Einträge aus der Sicherung ergänzen? Bestehende Einträge werden nicht verändert.`, ()=>{
      toAdd.forEach(s=> state.sessions.push(s));
      if(Array.isArray(backup.savedNames)){
        backup.savedNames.forEach(n=>{ if(!state.savedNames.includes(n)) state.savedNames.push(n); });
      }
      logBackupEvent('import', { addedCount: toAdd.length, sourceVersion: backup.exportedFromVersion || null });
      saveState();
      showToast(`${toAdd.length} Rennen wiederhergestellt`);
      renderCurrentView();
    });
  };
  reader.readAsText(file);
}

let archivFilter = [];

function archivFilterCardHtml(){
  const names = orderedSavedNames();
  return `<div class="card">
    <h2>Nach Besetzung filtern</h2>
    <div class="chip-grid" id="archivFilterChips">
      ${names.map(n=>`<div class="chip${archivFilter.includes(n)?' active':''}" data-archiv-filter-name="${escapeHtml(n)}">${escapeHtml(n)}</div>`).join('')}
    </div>
    ${archivFilter.length ? '<button class="add-toggle" id="archivFilterResetBtn" style="margin-top:8px;">Filter zurücksetzen</button>' : '<p class="muted" style="margin:8px 0 0;">Keine Auswahl = alle Rennen</p>'}
  </div>`;
}

function wireArchivFilterChips(){
  document.querySelectorAll('#archivFilterChips [data-archiv-filter-name]').forEach(chip=>{
    chip.onclick = ()=>{
      const n = chip.dataset.archivFilterName;
      const i = archivFilter.indexOf(n);
      if(i>=0) archivFilter.splice(i,1); else archivFilter.push(n);
      renderArchiv();
    };
  });
  const resetBtn = document.getElementById('archivFilterResetBtn');
  if(resetBtn) resetBtn.onclick = ()=>{ archivFilter = []; renderArchiv(); };
}

function renderArchiv(){
  const el = document.getElementById('archivContent');
  if (!el || !state || !Array.isArray(state.sessions)) return;

  const filtered = archivFilter.length
    ? state.sessions.filter(s=> s && sameSet(s.participants, archivFilter))
    : state.sessions;

  if(state.sessions.length === 0){
    el.innerHTML = '<div class="empty">Noch keine Rennen gespeichert.</div>';
    return;
  }
  if(filtered.length === 0){
    el.innerHTML = archivFilterCardHtml() + '<div class="empty">Keine Rennen mit genau dieser Besetzung.</div>';
    wireArchivFilterChips();
    return;
  }
  const sorted = filtered.slice().sort((a,b)=> (b.date || '').localeCompare(a.date || '') || (b.id || '').localeCompare(a.id || ''));

  el.innerHTML = archivFilterCardHtml() + sorted.map(s=>{
    const totals = sessionTotals(s);
    const rankedStandings = Object.entries(totals).sort((a,b)=>a[1]-b[1]);
    const winnerPts = rankedStandings.length ? rankedStandings[0][1] : null;

    const complete = s && Array.isArray(s.participants) && s.grid && s.participants.every(n=> Array.isArray(s.grid[n]) && s.grid[n].every(v=>v!==null && v!==undefined));

    return `<div class="card">
      <div class="session-head" data-toggle-id="${s.id}" style="cursor:pointer;">
        <div class="info"><b>${formatDate(s.date)}</b> · ${s.participants ? s.participants.length : 0} Fahrer${complete?'':' · unvollständig'}</div>
        <div style="display:flex;gap:6px;">
          <button data-edit-id="${s.id}">Bearbeiten</button>
          <button class="danger" data-delete-id="${s.id}">Löschen</button>
        </div>
      </div>
      <div class="match-standing" data-toggle-id="${s.id}" style="cursor:pointer;">${rankedStandings.map(([n,p])=>`<span class="${p===winnerPts?'win':''}">${escapeHtml(n)} ${p}</span>`).join('')}</div>
      <div class="archiv-detail" id="detail-${s.id}" style="display:none;margin-top:12px;"></div>
    </div>`;
  }).join('');

  wireArchivFilterChips();

  el.querySelectorAll('[data-toggle-id]').forEach(elToggle=>{
    elToggle.onclick = ()=>{
      const id = elToggle.dataset.toggleId;
      const detail = document.getElementById('detail-'+id);
      const isOpen = detail.style.display !== 'none';
      if(isOpen){
        detail.style.display = 'none';
        detail.innerHTML = '';
      } else {
        const session = state.sessions.find(x=>x.id===id);
        detail.innerHTML = session ? buildReadOnlyGridHtml(session) : '';
        detail.style.display = 'block';
      }
    };
  });

  el.querySelectorAll('[data-delete-id]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.deleteId;
      showConfirm('Dieses Rennen wirklich löschen?', ()=>{
        state.sessions = state.sessions.filter(x=>x.id!==id);
        saveState();
        renderArchiv();
      });
    };
  });

  el.querySelectorAll('[data-edit-id]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.editId;
      const openNow = ()=>{
        const session = state.sessions.find(x=>x.id===id);
        if(!session) return;
        const prevMatch = state.sessions
          .filter(x=>x.id!==id && sameSet(x.participants, session.participants) && x.date <= session.date)
          .slice().sort((a,b)=> (b.date || '').localeCompare(a.date || ''))[0] || null;
        draft = JSON.parse(JSON.stringify(session));
        const rounds = (draft.grid && draft.participants[0] && draft.grid[draft.participants[0]]) ? draft.grid[draft.participants[0]].length : 0;
        if(!draft.penalties) draft.penalties = {};
        draft.participants.forEach(n=>{ if(!(n in draft.penalties)) draft.penalties[n] = 0; });
        if(!draft.trackNames) draft.trackNames = [];
        while(draft.trackNames.length < rounds) draft.trackNames.push('');
        if(!draft.trackTimes) draft.trackTimes = {};
        draft.participants.forEach(n=>{
          if(!draft.trackTimes[n]) draft.trackTimes[n] = [];
          while(draft.trackTimes[n].length < rounds) draft.trackTimes[n].push(null);
        });
        if(typeof draft.note !== 'string') draft.note = '';
        draft.lastMatchInfo = prevMatch ? { date: prevMatch.date, standing: sessionTotals(prevMatch) } : null;
        rennenPhase = 'editing';
        saveDraft();
        switchView('rennen');
      };
      if(draft){
        showConfirm('Es gibt bereits ein unfertiges Rennen in Bearbeitung. Dieses verwerfen und stattdessen das gewählte bearbeiten?', ()=>{
          clearDraft().then(openNow);
        });
      } else {
        openNow();
      }
    };
  });
}

/* ---------------- STATISTIK ---------------- */
let calendarViewMonth = null;

const MONTH_NAMES = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WEEKDAY_LABELS = ['Mo','Di','Mi','Do','Fr','Sa','So'];

function buildActivityCalendarHtml(){
  const today = new Date();
  if(!calendarViewMonth) calendarViewMonth = { year: today.getFullYear(), month: today.getMonth() };
  const { year, month } = calendarViewMonth;

  const firstOfMonth = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const startWeekday = (firstOfMonth.getDay()+6)%7;

  const countByDate = {};
  if (state && Array.isArray(state.sessions)) {
    state.sessions.forEach(s=>{ countByDate[s.date] = (countByDate[s.date]||0) + 1; });
  }
  let maxCount = 1;
  Object.values(countByDate).forEach(c=>{ if(c>maxCount) maxCount=c; });

  const isCurrentOrFutureMonth = (year > today.getFullYear()) || (year === today.getFullYear() && month >= today.getMonth());

  let cellsHtml = '';
  for(let i=0;i<startWeekday;i++) cellsHtml += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const count = countByDate[dateStr] || 0;
    const isToday = dateStr === todayStr();
    let bg = 'rgba(255,255,255,0.05)', textColor = 'var(--muted)', fontWeight = '500';
    if(count > 0){
      const alpha = 0.3 + Math.min(1, count/maxCount)*0.6;
      bg = `rgba(0,229,255,${alpha.toFixed(2)})`;
      textColor = '#04222a';
      fontWeight = '700';
    }
    const ring = isToday ? 'box-shadow:0 0 0 2px var(--accent) inset;' : '';
    cellsHtml += `<div title="${escapeHtml(formatDate(dateStr))}: ${count} Rennen" style="aspect-ratio:1;border-radius:7px;background:${bg};${ring}
      display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:13px;font-weight:${fontWeight};color:${textColor};">${d}</div>`;
  }

  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <button id="calPrevBtn" style="padding:8px 16px;">‹</button>
      <h2 style="margin:0;">${MONTH_NAMES[month]} ${year}</h2>
      <button id="calNextBtn" style="padding:8px 16px;" ${isCurrentOrFutureMonth?'disabled':''}>›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;">
      ${WEEKDAY_LABELS.map(w=>`<div style="text-align:center;font-size:10px;color:var(--muted);letter-spacing:0.3px;">${w}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${cellsHtml}</div>
    <p class="muted" style="margin-top:10px;">Je heller, desto mehr Rennen an diesem Tag</p>
  </div>`;
}

function wireActivityCalendar(){
  const prevBtn = document.getElementById('calPrevBtn');
  const nextBtn = document.getElementById('calNextBtn');
  if(prevBtn){
    prevBtn.onclick = ()=>{
      calendarViewMonth.month--;
      if(calendarViewMonth.month < 0){ calendarViewMonth.month = 11; calendarViewMonth.year--; }
      renderStatistik();
    };
  }
  if(nextBtn && !nextBtn.disabled){
    nextBtn.onclick = ()=>{
      calendarViewMonth.month++;
      if(calendarViewMonth.month > 11){ calendarViewMonth.month = 0; calendarViewMonth.year++; }
      renderStatistik();
    };
  }
}

function renderStatistik(){
  const el = document.getElementById('statistikContent');
  if (!el || !state || !Array.isArray(state.sessions)) return;

  const earliestDate = state.sessions.length
    ? state.sessions.reduce((min,s)=> (s.date < min ? s.date : min), state.sessions[0].date)
    : todayStr();
  const effectiveFrom = statsFilter.from || earliestDate;
  const effectiveTo = statsFilter.to || todayStr();

  const filterCardHtml = `<div class="card">
    <h2>Zeitraum</h2>
    <div class="setup-row" style="display:flex;gap:10px;">
      <div style="flex:1;">
        <label style="display:block;font-size:11px;color:var(--muted);margin-bottom:6px;">Von</label>
        <input type="date" id="statsFromInput" value="${effectiveFrom}" />
      </div>
      <div style="flex:1;">
        <label style="display:block;font-size:11px;color:var(--muted);margin-bottom:6px;">Bis</label>
        <input type="date" id="statsToInput" value="${effectiveTo}" />
      </div>
    </div>
    ${(statsFilter.from || statsFilter.to) ? '<button class="add-toggle" id="statsResetBtn" style="margin-top:10px;">Zeitraum zurücksetzen</button>' : ''}
  </div>`;

  const sessions = state.sessions.filter(s=> s && s.date >= effectiveFrom && s.date <= effectiveTo);
  const activityCardHtml = buildActivityCalendarHtml();

  if(sessions.length===0){
    el.innerHTML = filterCardHtml + activityCardHtml + '<div class="empty">Keine Rennen in diesem Zeitraum.<br>Trage Ergebnisse im Rennen-Tab ein oder wähle einen anderen Zeitraum.</div>';
    wireStatsFilterInputs();
    wireActivityCalendar();
    return;
  }

  const stats = {};
  function ensure(n){ if(!stats[n]) stats[n]={sessions:0, rounds:0, points:0, wins:0, podiums:0, dnfs:0, stars:0, sessionWins:0, recent:[], raceDates:new Set(), penalties:0, totalTimeMs:0}; return stats[n]; }
  const comboCount = {};

  sessions.forEach(s=>{
    if (!s || !Array.isArray(s.participants)) return;
    const key = [...s.participants].sort().join(' + ');
    comboCount[key] = (comboCount[key]||0) + 1;
    const N = s.participants.length;
    s.participants.forEach(name=>{
      const st = ensure(name);
      st.sessions++;
      st.raceDates.add(s.date);
      const penalty = s.penalties && s.penalties[name];
      if(penalty){
        const p = Number(penalty) || 0;
        st.penalties += p;
        st.points += p;
      }
      if(s.trackTimes && s.trackTimes[name]){
        s.trackTimes[name].forEach(t=>{
          const ms = t ? parseTimeToMs(t) : null;
          if(ms!==null) st.totalTimeMs += ms;
        });
      }
      const arr = s.grid && s.grid[name] ? s.grid[name] : [];
      arr.forEach(val=>{
        if(val===null || val===undefined) return;
        st.rounds++;
        const isDnf = (val === 'DNF');
        const num = isDnf ? null : asPlacementNumber(val);
        const pts = isDnf ? N+1 : (num!==null ? num : 0);
        st.points += pts;
        st.recent.push({date:s.date, pts});
        if(isDnf) st.dnfs++;
        else{
          if(num===1) st.wins++;
          if(num!==null && num<=3) st.podiums++;
        }
        if(isStarredValue(val)) st.stars++;
      });
    });
    const totals = sessionTotals(s);
    const complete = s.participants.every(n=> Array.isArray(s.grid[n]) && s.grid[n].every(v=>v!==null && v!==undefined));
    if(complete){
      const winnerEntry = Object.entries(totals).sort((a,b)=>a[1]-b[1])[0];
      if (winnerEntry) ensure(winnerEntry[0]).sessionWins++;
    }
  });

  const totalSessions = sessions.length;
  const totalRoundsPlayed = sessions.reduce((sum,s)=> sum + (s.participants ? Math.max(...s.participants.map(n=>(s.grid && s.grid[n]) ? s.grid[n].filter(v=>v!==null&&v!==undefined).length : 0),0) : 0), 0);

  let html = `<div class="stat-grid">
    <div class="stat-box"><div class="num">${totalSessions}</div><div class="lbl">Sessions</div></div>
    <div class="stat-box"><div class="num">${totalRoundsPlayed}</div><div class="lbl">Tracks gesamt</div></div>
  </div>`;

  const statEntries = Object.entries(stats).filter(([,st])=>st.rounds>0);
  const totalPointsAll = statEntries.reduce((a,[,st])=>a+st.points,0);
  const totalRoundsAll = statEntries.reduce((a,[,st])=>a+st.rounds,0);
  const groupAvg = totalRoundsAll ? totalPointsAll/totalRoundsAll : 0;
  const C = 12;

  const rankedByFair = statEntries.map(([name,st])=>{
    const rawAvg = st.points/st.rounds;
    const adjusted = (st.points + C*groupAvg) / (st.rounds + C);
    return [name, st, rawAvg, adjusted];
  }).sort((a,b)=> a[3]-b[3]);

  const crownHolder = getStreakCrownHolder();
  html += `<div class="card"><h2>Gesamtranking</h2><div class="standing-list">`;
  html += rankedByFair.map(([name,st,rawAvg,adjusted],i)=>{
    const cls = i===0?'p1':i===1?'p2':i===2?'p3':'';
    const badge = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    const crown = (crownHolder && crownHolder.name===name) ? ` 👑<span style="font-size:11px;color:var(--muted);"> (${crownHolder.streak}x in Folge)</span>` : '';
    return `<div class="result-row">
      <div class="rank-badge ${cls}">${badge}</div>
      <div class="name">${escapeHtml(name)}${crown}</div>
      <div class="pts">${adjusted.toFixed(2)}</div>
    </div>`;
  }).join('');
  html += `</div><p class="muted" style="margin-top:10px;">
    So wird gerechnet: <b style="color:var(--text);">bereinigter Schnitt = (eigene Punktesumme + ${C} × Gruppen-Durchschnitt) ÷ (eigene Streckenanzahl + ${C})</b>.
    Der aktuelle Gruppen-Durchschnitt liegt bei ${groupAvg.toFixed(2)} Punkten pro Strecke.
    Niedriger = besser.</p></div>`;

  html += `<div class="card"><h2>Fahrer-Statistik</h2>
    <div class="table-wrap"><table class="stats"><thead><tr>
      <th>Name</th><th>Renntage</th><th>Strecken</th><th>Sess.-Sieg</th><th>Renn.-Sieg</th><th>Podest %</th><th>Ø Pkt</th><th>DNF %</th><th>Strafp.</th><th>⭐</th><th>Fahrzeit</th>
    </tr></thead><tbody>`;
  Object.entries(stats)
    .sort((a,b)=> a[1].points - b[1].points)
    .forEach(([name,st])=>{
      const avg = st.rounds ? (st.points/st.rounds).toFixed(1) : '–';
      const podiumPct = st.rounds ? Math.round(100*st.podiums/st.rounds) : 0;
      const dnfPct = st.rounds ? Math.round(100*st.dnfs/st.rounds) : 0;
      html += `<tr>
        <td>${escapeHtml(name)}</td>
        <td>${st.raceDates.size}</td>
        <td>${st.rounds}</td>
        <td>${st.sessionWins}</td>
        <td>${st.wins}</td>
        <td>${podiumPct}%</td>
        <td>${avg}</td>
        <td>${dnfPct}%</td>
        <td>${st.penalties}</td>
        <td>${st.stars}</td>
        <td>${formatDurationMs(st.totalTimeMs)}</td>
      </tr>`;
    });
  html += `</tbody></table></div>`;
  html += `<p class="muted" style="margin-top:10px;">Ø Pkt = durchschnittliche Punkte pro Strecke (niedriger = besser) · Renntage = Anzahl unterschiedlicher Tage mit Teilnahme · Strecken = Anzahl gefahrener Rennstrecken gesamt · DNF % = Anteil nicht abgeschlossener Strecken · Strafp. = Summe aller erhaltenen Strafpunkte · ⭐ = Anzahl "letzter Tropfen Benzin"-Rettungen auf Platz 1 · Fahrzeit = Summe aller eingetragenen Streckenzeiten (h:mm:ss)</p>
  </div>`;

  const comboSorted = Object.entries(comboCount).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
  html += `<div class="card"><h2>Besetzungen</h2>
    <table class="stats"><thead><tr><th>Fahrer</th><th>Anzahl</th></tr></thead><tbody>`;
  comboSorted.forEach(([combo,count])=>{
    html += `<tr><td>${escapeHtml(combo)}</td><td>${count}×</td></tr>`;
  });
  html += `</tbody></table>
  <p class="muted" style="margin-top:10px;">Wie oft jede Fahrer-Kombination bisher zusammen gefahren ist</p>
  </div>`;

  el.innerHTML = filterCardHtml + activityCardHtml + html;
  wireStatsFilterInputs();
  wireActivityCalendar();
}

function wireStatsFilterInputs(){
  const fromInput = document.getElementById('statsFromInput');
  const toInput = document.getElementById('statsToInput');
  const resetBtn = document.getElementById('statsResetBtn');
  if(fromInput){
    fromInput.addEventListener('change', e=>{
      statsFilter.from = e.target.value || null;
      renderStatistik();
    });
  }
  if(toInput){
    toInput.addEventListener('change', e=>{
      statsFilter.to = e.target.value || null;
      renderStatistik();
    });
  }
  if(resetBtn){
    resetBtn.onclick = ()=>{
      statsFilter = { from: null, to: null };
      renderStatistik();
    };
  }
}

/* ---------------- NAV / INIT ---------------- */
document.querySelectorAll('nav.bottom button').forEach(btn=>{ btn.onclick = ()=>switchView(btn.dataset.view); });

document.getElementById('versionBadge').innerHTML = `<b>V${APP_VERSION}</b> · ${formatDate(APP_VERSION_DATE)}`;
document.getElementById('versionBadge').style.cursor = 'pointer';
document.getElementById('versionBadge').onclick = showVersionHistory;

loadState();
</script>
